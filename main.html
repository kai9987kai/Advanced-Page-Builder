    }

    function isLocked(id) {
      const d = app.docops;
      return !!(d && typeof d.isLocked === 'function' && d.isLocked(store.doc, id));
    }

    function coarsePointer() {
      return !!(app.env && app.env.coarse);
    }

    function polygon(r) {
      const cx = r.x + r.w / 2;
      const cy = r.y + r.h / 2;
      const pts = [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([sx, sy]) => {
        const p = rot((sx * r.w) / 2, (sy * r.h) / 2, r.rotation || 0);
        return project(cx + p.x, cy + p.y);
      });
      return pts;
    }

    function crisp(v) {
      return Math.round(v) + 0.5;
    }

    function polyPath(pts, snap) {
      if (snap) {
        const x1 = crisp(Math.min(pts[0].x, pts[2].x));
        const x2 = crisp(Math.max(pts[0].x, pts[2].x)) - 1;
        const y1 = crisp(Math.min(pts[0].y, pts[2].y));
        const y2 = crisp(Math.max(pts[0].y, pts[2].y)) - 1;
        return 'M' + x1 + ' ' + y1 + 'H' + Math.max(x1, x2) + 'V' + Math.max(y1, y2) + 'H' + x1 + 'Z';
      }
      return 'M' + pts.map((p) => p.x.toFixed(2) + ' ' + p.y.toFixed(2)).join('L') + 'Z';
    }

    function boundsOfPoints(pts) {
      let minX = Infinity;
      let minY = Infinity;
      let maxX = -Infinity;
      let maxY = -Infinity;
      for (const p of pts) {
        if (p.x < minX) minX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.x > maxX) maxX = p.x;
        if (p.y > maxY) maxY = p.y;
      }
      return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
    }

    /* -------------------------------------------------------- geometry */

    function computeGeometry() {
      renderer().flush();
      geomStale = false;
      const doc = store.doc;
      const ids = store.selection.filter((id) => Object.prototype.hasOwnProperty.call(doc.nodes, id));
      const rects = [];
      let anyUnlocked = false;
      let allLocked = ids.length > 0;
      for (const id of ids) {
        const r = renderer().worldRect(id);
        if (!r) continue;
        const locked = isLocked(id);
        if (locked) { /* keep */ } else { anyUnlocked = true; allLocked = false; }
        rects.push({ id, r, locked });
      }
      let box = null;
      if (rects.length === 1) {
        box = Object.assign({}, rects[0].r);
      } else if (rects.length > 1) {
        const items = [];
        for (const it of rects) {
          const r = it.r;
          if (!r.rotation) { items.push(r); continue; }
          const cx = r.x + r.w / 2;
          const cy = r.y + r.h / 2;
          for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
            const p = rot((sx * r.w) / 2, (sy * r.h) / 2, r.rotation);
            items.push({ x: cx + p.x, y: cy + p.y, w: 0, h: 0 });
          }
        }
        const u = geometry.union(items);
        box = u ? { x: u.x, y: u.y, w: u.w, h: u.h, rotation: 0 } : null;
      }
      let aabb = null;
      if (box && rects.length === 1 && box.rotation) {
        const pts = [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([sx, sy]) => {
          const p = rot((sx * box.w) / 2, (sy * box.h) / 2, box.rotation);
          return { x: box.x + box.w / 2 + p.x, y: box.y + box.h / 2 + p.y };
        });
        aabb = boundsOfPoints(pts);
      } else if (box) {
        aabb = { x: box.x, y: box.y, w: box.w, h: box.h };
      }
      geom = { ids, rects, box, aabb, locked: allLocked && rects.length > 0, anyUnlocked };
      hoverStale = true;
    }

    /** Axis-aligned page bounds of the rendered selection (shared with the rulers) or null. */
    function selectionBounds() {
      const g = ensureGeometry();
      return g.aabb ? Object.assign({}, g.aabb) : null;
    }

    function markStale() {
      geomStale = true;
      hoverStale = true;
    }

    function ensureGeometry() {
      if (geomStale) computeGeometry();
      return geom;
    }

    function handlesEnabled() {
      const g = ensureGeometry();
      if (!g.box || !g.anyUnlocked) return false;
      if (store.view.editingText) return false;
      if (transient.hideHandles || transient.hideSelection) return false;
      return (store.view.tool || 'select') === 'select';
    }

    function screenBox() {
      const g = ensureGeometry();
      if (!g.box) return null;
      const z = vp().zoom;
      const c = project(g.box.x + g.box.w / 2, g.box.y + g.box.h / 2);
      return { cx: c.x, cy: c.y, w: g.box.w * z, h: g.box.h * z, rotation: g.box.rotation || 0 };
    }

    function handleCenters(sb) {
      const out = {};
      for (const hId of HANDLES) {
        const [sx, sy] = HANDLE_DIR[hId];
        const p = rot((sx * sb.w) / 2, (sy * sb.h) / 2, sb.rotation);
        out[hId] = { x: sb.cx + p.x, y: sb.cy + p.y };
      }
      const k = rot(0, -sb.h / 2 - ROTATE_OFFSET, sb.rotation);
      out.rotate = { x: sb.cx + k.x, y: sb.cy + k.y };
      const t = rot(0, -sb.h / 2, sb.rotation);
      out.top = { x: sb.cx + t.x, y: sb.cy + t.y };
      return out;
    }

    function visibleHandles(sb) {
      const small = sb.w < SMALL_EDGE || sb.h < SMALL_EDGE;
      return small ? CORNERS : HANDLES;
    }

    /* ------------------------------------------------------------ draw */

    function drawHover() {
      const id = transient.hideHover || transient.marquee ? null : store.view.hover;
      const valid = id && Object.prototype.hasOwnProperty.call(store.doc.nodes, id) && !geom.ids.includes(id) && !store.view.editingText;
      if (!valid) { show(hoverPath, false); hoverId = null; return; }
      if (id !== hoverId || hoverStale) {
        hoverId = id;
        hoverStale = false;
        hoverRect = renderer().worldRect(id);
      }
      if (!hoverRect) { show(hoverPath, false); return; }
      const pts = polygon(hoverRect);
      attr(hoverPath, 'd', polyPath(pts, !hoverRect.rotation));
      show(hoverPath, true);
    }

    function drawSelection() {
      const g = geom;
      const editing = !!store.view.editingText;
      const hideSel = transient.hideSelection || !g.box;
      // Per-node outlines (multi-selection, or the single node while a gesture hides the box).
      if (!hideSel && g.rects.length > 1 && !editing) {
        let d = '';
        for (const it of g.rects) d += polyPath(polygon(it.r), !it.r.rotation);
        attr(outlinePath, 'd', d);
        show(outlinePath, true);
      } else {
        show(outlinePath, false);
      }

      if (hideSel || editing) {
        show(boxPath, false);
        show(handlesPath, false);
        show(rotLine, false);
        show(rotKnob, false);
        show(sizeLabel, false);
        drawBadges(editing ? [] : g.rects);
        return;
      }

      const boxPts = polygon(g.box);
      attr(boxPath, 'd', polyPath(boxPts, !g.box.rotation));
      show(boxPath, true);
      boxPath.classList.toggle('apb-ov-locked', g.locked);

      const sb = screenBox();
      const handlesOn = handlesEnabled();
      if (handlesOn) {
        const centers = handleCenters(sb);
        const hs = HANDLE_SIZE / 2;
        let d = '';
        for (const hId of visibleHandles(sb)) {
          const c = centers[hId];
          if (!sb.rotation) {
            const x = crisp(c.x - hs);
            const y = crisp(c.y - hs);
            d += 'M' + x + ' ' + y + 'h' + (HANDLE_SIZE - 1) + 'v' + (HANDLE_SIZE - 1) + 'h' + (1 - HANDLE_SIZE) + 'Z';
          } else {
            const pts = [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([sx, sy]) => {
              const p = rot(sx * hs, sy * hs, sb.rotation);
              return { x: c.x + p.x, y: c.y + p.y };
            });
            d += polyPath(pts, false);
          }
        }
        attr(handlesPath, 'd', d);
        show(handlesPath, true);
        attr(rotLine, 'd', 'M' + centers.top.x.toFixed(2) + ' ' + centers.top.y.toFixed(2) + 'L' + centers.rotate.x.toFixed(2) + ' ' + centers.rotate.y.toFixed(2));
        attr(rotKnob, 'cx', centers.rotate.x.toFixed(2));
        attr(rotKnob, 'cy', centers.rotate.y.toFixed(2));
        show(rotLine, true);
        show(rotKnob, true);
      } else {
        show(handlesPath, false);
        show(rotLine, false);
        show(rotKnob, false);
      }

      // Size label below the selection.
      const b = boundsOfPoints(boxPts);
      const labelText = transient.label != null ? String(transient.label) : fmt(g.box.w) + ' × ' + fmt(g.box.h);
      text(sizeText, labelText);
      const wLabel = Math.ceil(labelText.length * 6.4 + 12);
      const lx = Math.round(b.x + b.w / 2);
      const ly = Math.round(b.y + b.h + 8);
      attr(sizeBg, 'x', lx - wLabel / 2);
      attr(sizeBg, 'y', ly);
      attr(sizeBg, 'width', wLabel);
      attr(sizeText, 'x', lx);
      attr(sizeText, 'y', ly + 9);
      show(sizeLabel, true);

      drawBadges(g.rects);
    }

    function drawBadges(rects) {
      const locked = rects.filter((it) => it.locked).slice(0, MAX_BADGES);
      while (badges.length < locked.length) {
        const g = s('g', 'apb-ov-badge', badgeGroup);
        s('rect', null, g, { width: '16', height: '16', rx: '3', ry: '3' });
        let icon = null;
        if (typeof APB !== 'undefined' && APB.has('icons')) {
          try { icon = APB.require('icons').get('lock', { size: 12 }); } catch (_) { icon = null; }
        }
        if (icon) {
          icon.setAttribute('x', '2');
          icon.setAttribute('y', '2');
          icon.setAttribute('width', '12');
          icon.setAttribute('height', '12');
          g.appendChild(icon);
        } else {
          s('path', null, g, { d: 'M5 8h6v5H5zM6.5 8V6.5a1.5 1.5 0 0 1 3 0V8', fill: 'none' });
        }
        badges.push(g);
      }
      badges.forEach((g, i) => {
        const it = locked[i];
        if (!it) { show(g, false); return; }
        const b = boundsOfPoints(polygon(it.r));
        attr(g, 'transform', 'translate(' + Math.round(b.x) + ' ' + Math.round(b.y - 20) + ')');
        show(g, true);
      });
    }

    function drawMarquee() {
      const m = transient.marquee;
      if (!m) { show(marqueeRect, false); return; }
      const a = project(m.x, m.y);
      const z = vp().zoom;
      attr(marqueeRect, 'x', crisp(a.x));
      attr(marqueeRect, 'y', crisp(a.y));
      attr(marqueeRect, 'width', Math.max(0, Math.round(m.w * z) - 1));
      attr(marqueeRect, 'height', Math.max(0, Math.round(m.h * z) - 1));
      show(marqueeRect, true);
    }

    function drawGuides() {
      const guides = Array.isArray(transient.guides) ? transient.guides : [];
      if (!guides.length) { show(guidePath, false); } else {
        let d = '';
        for (const gd of guides) {
          if (!gd || !Number.isFinite(gd.pos)) continue;
          if (gd.axis === 'x') {
            const p1 = project(gd.pos, gd.from);
            const p2 = project(gd.pos, gd.to);
            const x = crisp(p1.x);
            d += 'M' + x + ' ' + p1.y.toFixed(1) + 'V' + p2.y.toFixed(1);
            d += 'M' + (x - 3) + ' ' + (p1.y - 3).toFixed(1) + 'l6 6m0 -6l-6 6';
            d += 'M' + (x - 3) + ' ' + (p2.y - 3).toFixed(1) + 'l6 6m0 -6l-6 6';
          } else {
            const p1 = project(gd.from, gd.pos);
            const p2 = project(gd.to, gd.pos);
            const y = crisp(p1.y);
            d += 'M' + p1.x.toFixed(1) + ' ' + y + 'H' + p2.x.toFixed(1);
            d += 'M' + (p1.x - 3).toFixed(1) + ' ' + (y - 3) + 'l6 6m0 -6l-6 6';
            d += 'M' + (p2.x - 3).toFixed(1) + ' ' + (y - 3) + 'l6 6m0 -6l-6 6';
          }
        }
        attr(guidePath, 'd', d);
        show(guidePath, !!d);
      }

      const spacing = Array.isArray(transient.spacing) ? transient.spacing.slice(0, MAX_SPACING_LABELS) : [];
      let d = '';
      spacing.forEach((sp, i) => {
        if (!sp || !Number.isFinite(sp.from) || !Number.isFinite(sp.to) || !Number.isFinite(sp.pos)) return;
        let a;
        let b;
        let mid;
        if (sp.axis === 'x') {
          a = project(sp.from, sp.pos);
          b = project(sp.to, sp.pos);
          const y = crisp(a.y);
          d += 'M' + a.x.toFixed(1) + ' ' + y + 'H' + b.x.toFixed(1) + 'M' + a.x.toFixed(1) + ' ' + (y - 4) + 'v8M' + b.x.toFixed(1) + ' ' + (y - 4) + 'v8';
          mid = { x: (a.x + b.x) / 2, y: y + 12 };
        } else {
          a = project(sp.pos, sp.from);
          b = project(sp.pos, sp.to);
          const x = crisp(a.x);
          d += 'M' + x + ' ' + a.y.toFixed(1) + 'V' + b.y.toFixed(1) + 'M' + (x - 4) + ' ' + a.y.toFixed(1) + 'h8M' + (x - 4) + ' ' + b.y.toFixed(1) + 'h8';
          mid = { x: x + 8 + 14, y: (a.y + b.y) / 2 };
        }
        let lab = spacingPool[i];
        if (!lab) {
          const g = s('g', 'apb-ov-label apb-ov-spacing-label', spacingLabels);
          lab = { g, bg: s('rect', null, g, { rx: '3', ry: '3', height: '16' }), t: s('text', null, g, { 'text-anchor': 'middle', 'dominant-baseline': 'central' }) };
          spacingPool.push(lab);
        }
        const label = fmt(Number.isFinite(sp.gap) ? sp.gap : Math.abs(sp.to - sp.from));
        text(lab.t, label);
        const w = Math.ceil(label.length * 6.4 + 10);
        attr(lab.bg, 'x', Math.round(mid.x - w / 2));
        attr(lab.bg, 'y', Math.round(mid.y - 8));
        attr(lab.bg, 'width', w);
        attr(lab.t, 'x', Math.round(mid.x));
        attr(lab.t, 'y', Math.round(mid.y));
        show(lab.g, true);
      });
      for (let i = spacing.length; i < spacingPool.length; i++) show(spacingPool[i].g, false);
      attr(spacingPath, 'd', d);
      show(spacingPath, !!d);
    }

    function drawTip() {
      const r = transient.rotation;
      if (!r || !Number.isFinite(r.angle)) { show(tip, false); return; }
      const rect = canvas.el.getBoundingClientRect();
      let a = r.angle % 360;
      if (a > 180) a -= 360;
      if (a <= -180) a += 360;
      const label = fmt(a) + '°';
      text(tipText, label);
      const w = Math.ceil(label.length * 6.8 + 14);
      const x = Math.round((Number.isFinite(r.clientX) ? r.clientX - rect.left : 0) + 16);
      const y = Math.round((Number.isFinite(r.clientY) ? r.clientY - rect.top : 0) + 16);
      attr(tipBg, 'x', x);
      attr(tipBg, 'y', y);
      attr(tipBg, 'width', w);
      attr(tipText, 'x', x + 7);
      attr(tipText, 'y', y + 10);
      show(tip, true);
    }

    function refresh(info) {
      if (destroyed) return;
      ensureGeometry();
      drawHover();
      drawSelection();
      drawMarquee();
      drawGuides();
      drawTip();
    }

    /* -------------------------------------------------------- hit test */

    /**
     * hitTest(clientX, clientY, { coarse }) → { type: 'handle', handle } | { type: 'rotate', corner }
     * | { type: 'body' } | null. Handles and rotation zones only exist when handles are shown.
     */
    function hitTest(clientX, clientY, hitOpts) {
      const g = ensureGeometry();
      if (!g.box || store.view.editingText) return null;
      const sb = screenBox();
      const rect = canvas.el.getBoundingClientRect();
      const px = clientX - rect.left - sb.cx;
      const py = clientY - rect.top - sb.cy;
      const l = rot(px, py, -sb.rotation);
      const hw = sb.w / 2;
      const hh = sb.h / 2;
      const inside = Math.abs(l.x) <= hw && Math.abs(l.y) <= hh;
      const coarse = hitOpts && hitOpts.coarse !== undefined ? !!hitOpts.coarse : coarsePointer();
      const r = (coarse ? HIT_COARSE : HIT) / 2;
      if (handlesEnabled()) {
        const k = { x: 0, y: -hh - ROTATE_OFFSET };
        if (Math.hypot(l.x - k.x, l.y - k.y) <= r) return { type: 'rotate', corner: 'n', handle: 'rotate' };
        const small = sb.w < r * 3 || sb.h < r * 3;
        for (const c of CORNERS) {
          const [sx, sy] = HANDLE_DIR[c];
          const dx = l.x - sx * hw;
          const dy = l.y - sy * hh;
          if (Math.abs(dx) <= r && Math.abs(dy) <= r) {
            if (small && inside && Math.hypot(dx, dy) > 5) continue;
            return { type: 'handle', handle: c };
          }
        }
        if (!(sb.w < SMALL_EDGE || sb.h < SMALL_EDGE)) {
          const inY = Math.min(r, hh / 3);
          const inX = Math.min(r, hw / 3);
          if (Math.abs(l.x) <= hw) {
            if (l.y >= -hh - r && l.y <= -hh + inY) return { type: 'handle', handle: 'n' };
            if (l.y <= hh + r && l.y >= hh - inY) return { type: 'handle', handle: 's' };
          }
          if (Math.abs(l.y) <= hh) {
            if (l.x >= -hw - r && l.x <= -hw + inX) return { type: 'handle', handle: 'w' };
            if (l.x <= hw + r && l.x >= hw - inX) return { type: 'handle', handle: 'e' };
          }
        }
        if (!inside) {
          for (const c of CORNERS) {
            const [sx, sy] = HANDLE_DIR[c];
            const ox = sx * l.x - hw;
            const oy = sy * l.y - hh;
            if (ox >= -r && oy >= -r && ox <= r + ROTATE_ZONE && oy <= r + ROTATE_ZONE) return { type: 'rotate', corner: c };
          }
        }
      }
      return inside && !transient.hideSelection ? { type: 'body' } : null;
    }

    function cursorFor(hit) {
      if (!hit) return '';
      const rotation = geom.box ? geom.box.rotation || 0 : 0;
      if (hit.type === 'handle') return resizeCursor(hit.handle, rotation);
      if (hit.type === 'rotate') return rotateCursor((CORNER_ANGLE[hit.corner] !== undefined ? CORNER_ANGLE[hit.corner] : 45) + rotation);
      return '';
    }

    /* -------------------------------------------------------------- API */

    function invalidate() {
      geomStale = true;
      hoverStale = true;
      if (canvas.invalidateOverlay) canvas.invalidateOverlay();
    }

    function set(patch) {
      if (!patch || typeof patch !== 'object') return;
      for (const k of Object.keys(patch)) {
        if (!TRANSIENT_KEYS.includes(k)) continue;
        transient[k] = patch[k];
      }
      if (canvas.invalidateOverlay) canvas.invalidateOverlay();
    }

    function clear() {
      set({ marquee: null, guides: [], spacing: [], rotation: null, hideHandles: false, hideHover: false, hideSelection: false, label: null });
    }

    /** Named <g> layer (page-independent, screen space) for other canvas features (drop indicators, measurements). */
    function layer(name) {
      const key = String(name || 'default');
      if (!layers.has(key)) layers.set(key, s('g', 'apb-ov-layer apb-ov-layer-' + key.replace(/[^\w-]/g, ''), layerHost));
      return layers.get(key);
    }

    /** Client-coordinate handle centres of the current selection box (tests, keyboard helpers). */
    function handlePoints() {
      const sb = screenBox();
      if (!sb) return null;
      const rect = canvas.el.getBoundingClientRect();
      const c = handleCenters(sb);
      const out = {};
      for (const k of Object.keys(c)) out[k] = { x: c[k].x + rect.left, y: c[k].y + rect.top };
      out.center = { x: sb.cx + rect.left, y: sb.cy + rect.top };
      return out;
    }

    offs.push(store.on('selection', () => { geomStale = true; }));
    offs.push(store.on('change', () => { geomStale = true; hoverStale = true; }));
    offs.push(store.on('view', (p) => {
      const ch = (p && p.changed) || [];
      if (ch.some((k) => k !== 'zoom' && k !== 'x' && k !== 'y' && k !== 'hover')) geomStale = true;
    }));

    function destroy() {
      if (destroyed) return;
      destroyed = true;
      offs.splice(0).forEach((off) => { try { off(); } catch (_) { /* ignore */ } });
      root.remove();
    }

    return {
      el: svg,
      refresh, destroy, set, clear, layer, invalidate, markStale, selectionBounds, hitTest, cursorFor, handlePoints,
      get state() { return Object.assign({}, transient); },
      get box() { const g = ensureGeometry(); return g.box ? Object.assign({}, g.box) : null; },
      get rects() { return ensureGeometry().rects.map((it) => ({ id: it.id, locked: it.locked, rect: Object.assign({}, it.r) })); },
      get handlesVisible() { return handlesEnabled(); },
      screenBox
    };
  }

  return { create, HANDLES, resizeCursor, rotateCursor, HIT, HIT_COARSE };
});
</script>
<script data-src="js/canvas/interaction.js">
/*
 * interaction — pointer tools & gesture state machine for the canvas (ARCHITECTURE.md §7).
 *
 * Architecture (extensible — later canvas features plug in here):
 * - Tools (`registerTool(name, def)`) are keyed by `store.view.tool`. A tool's `down(ctx, pt)` returns
 *   a *pending press* `{ drag(pt) → gesture|null, click(pt), cursor }` (the drag starts after a 3 px
 *   threshold) or directly a *gesture*. Optional: `dblclick(ctx, pt)`, `hover(ctx, pt) → { hover, cursor }`,
 *   `contextmenu(ctx, pt)`, `keydown(ctx, event) → handled`.
 * - Gestures (`registerGesture(name, factory)`; `ctx.gesture(name, opts)` creates one) implement
 *   `{ name, cursor?, move(pt), end(pt), cancel() }`. Built-in: `move`, `resize`, `rotate`, `marquee`.
 * - `pt` = { clientX, clientY, page: {x,y}, shift, alt, mod, coarse, pointerType, event }.
 * - Pointer Events + setPointerCapture; pointercancel / lostpointercapture / Escape / two-finger
 *   viewport gestures cancel the active gesture (document changes are undone through `ctx.history`).
 * - Modifier changes during a gesture re-run `move` with the last pointer position.
 * - Every gesture's document writes share one coalesce key; `ctx.history.finalize` guarantees a
 *   single undo entry per gesture even when the coalesce window lapsed during a slow drag.
 */
APB.define('interaction', ['util', 'geometry', 'snapping', 'schema', 'elements'], function (util, geometry, snapping, schema, elements) {
  'use strict';

  const DRAG_THRESHOLD = 3;
  const PERF_SAMPLES = 240;
  const toolDefs = new Map();
  const gestureDefs = new Map();
  let keySeq = 0;

  const own = (o, k) => !!o && Object.prototype.hasOwnProperty.call(o, k);

  function registerTool(name, def) {
    if (typeof name !== 'string' || !name || !def || typeof def !== 'object') throw new TypeError('interaction.registerTool(name, def) needs a name and a definition');
    toolDefs.set(name, def);
    return () => { if (toolDefs.get(name) === def) toolDefs.delete(name); };
  }

  function registerGesture(name, factory) {
    if (typeof name !== 'string' || !name || typeof factory !== 'function') throw new TypeError('interaction.registerGesture(name, factory) needs a name and a factory');
    gestureDefs.set(name, factory);
    return () => { if (gestureDefs.get(name) === factory) gestureDefs.delete(name); };
  }

  function normAngle(a) {
    let r = a % 360;
    if (r > 180) r -= 360;
    if (r <= -180) r += 360;
    return Object.is(r, -0) ? 0 : r;
  }

  function rotV(x, y, deg) {
    if (!deg) return { x, y };
    const r = (deg * Math.PI) / 180;
    const c = Math.cos(r);
    const s = Math.sin(r);
    return { x: x * c - y * s, y: x * s + y * c };
  }

  function layerWord(n) {
    return n === 1 ? 'layer' : n + ' layers';
  }

  /* ================================================================ gestures */

  /** move: drag the movable top-level selection (free parents), snapping, Shift axis lock, Alt duplicates. */
  registerGesture('move', function (ctx, o) {
    const { store, app, canvas } = ctx;
    const docops = app.docops;
    let ids = ctx.movableIds(o.ids || store.selection);
    if (!ids.length || !docops) return null;
    const key = ctx.coalesceKey('move');
    const mark = ctx.history.mark();
    const start = o.start;
    const origIds = ids.slice();
    let duplicated = false;
    if (o.duplicate) {
      const copies = store.transact('Duplicate ' + layerWord(ids.length), () => docops.duplicate(store, ids, { offset: 0 }), { coalesce: key });
      if (Array.isArray(copies) && copies.length) { ids = copies; duplicated = true; }
    }
    const label = duplicated ? 'Duplicate ' + layerWord(ids.length) : 'Move ' + layerWord(ids.length);
    const startRect = canvas.renderer.bounds(origIds);
    if (!startRect) return null;
    const index = snapping.createIndex(ctx.snapTargets(ids));
    const applied = { dx: 0, dy: 0 };
    let axisLock = null;
    let changed = duplicated;

    function move(pt) {
      let dx = pt.page.x - start.page.x;
      let dy = pt.page.y - start.page.y;
      const z = canvas.viewport.zoom || 1;
      if (pt.shift) {
        if (!axisLock && Math.hypot(dx, dy) * z > 4) axisLock = Math.abs(dx) >= Math.abs(dy) ? 'x' : 'y';
        if (axisLock === 'x') dy = 0;
        if (axisLock === 'y') dx = 0;
      } else {
        axisLock = null;
      }
      let x = startRect.x + dx;
      let y = startRect.y + dy;
      let guides = [];
      let spacing = [];
      let snapX = false;
      let snapY = false;
      const snap = ctx.snapConfig(pt);
      if (snap.enabled) {
        const r = snapping.snapMove({ rect: { x, y, w: startRect.w, h: startRect.h }, index, grid: snap.grid, gridSize: snap.gridSize, threshold: snap.threshold, objects: snap.objects });
        if (axisLock !== 'y' && r.snapped.x) { x += r.dx; snapX = true; }
        if (axisLock !== 'x' && r.snapped.y) { y += r.dy; snapY = true; }
        guides = r.guides.filter((g) => (g.axis === 'x' ? snapX : snapY));
        spacing = (r.spacing || []).filter((s) => (s.axis === 'x' ? snapX : snapY));
      }
      if (!snapX) x = Math.round(x);
      if (!snapY) y = Math.round(y);
      const tdx = axisLock === 'y' ? 0 : x - startRect.x;
      const tdy = axisLock === 'x' ? 0 : y - startRect.y;
      const sdx = tdx - applied.dx;
      const sdy = tdy - applied.dy;
      if (Math.abs(sdx) > 1e-6 || Math.abs(sdy) > 1e-6) {
        docops.move(store, ids, sdx, sdy, { coalesce: key, label });
        applied.dx = tdx;
        applied.dy = tdy;
        changed = true;
      }
      ctx.overlay.set({ guides, spacing, hideHandles: true, hideHover: true });
    }

    return {
      name: 'move',
      cursor: 'default',
      get ids() { return ids.slice(); },
      move,
      end() {
        ctx.overlay.clear();
        if (!changed) return;
        ctx.history.finalize(mark, () => {
          store.transact(label, () => {
            const t = duplicated ? docops.duplicate(store, origIds, { offset: 0 }) : origIds;
            if (applied.dx || applied.dy) docops.move(store, t, applied.dx, applied.dy, { label });
          });
        });
      },
      cancel() {
        ctx.overlay.clear();
        if (changed) ctx.history.cancel(mark);
      }
    };
  });

  /** resize: 8 handles, rotation-aware for one node; multi-selection scales boxes within the union bounds. */
  registerGesture('resize', function (ctx, o) {
    const { store, app, canvas } = ctx;
    const docops = app.docops;
    if (!docops) return null;
    const handle = String(o.handle || 'se');
    const doc = store.doc;
    const bp = store.view.bp;
    const top = docops.topLevel(doc, store.selection);
    const items = [];
    for (const id of top) {
      const wr = canvas.renderer.worldRect(id);
      const eff = schema.effectiveNode(doc, id, bp);
      if (!wr || !eff) continue;
      items.push(ctx.boxItem(id, wr, eff));
    }
    const movable = items.filter((it) => !it.locked);
    if (!movable.length) return null;
    const single = items.length === 1;
    const key = ctx.coalesceKey('resize');
    const mark = ctx.history.mark();
    const start = o.start;
    const index = snapping.createIndex(ctx.snapTargets(items.map((it) => it.id)));
    const base = single ? { x: items[0].wr.x, y: items[0].wr.y, w: items[0].wr.w, h: items[0].wr.h } : ctx.unionOf(items);
    const rotation = single ? items[0].wr.rotation || 0 : 0;
    const keepDefault = single && ctx.keepsAspect(items[0].eff.type);
    const label = 'Resize ' + layerWord(movable.length);
    let changed = false;
    let lastBoxes = null;

    function roundRect(r, snapped, fromCenter) {
      if (rotation) return r;
      const out = Object.assign({}, r);
      const sx = handle.includes('e') ? 1 : handle.includes('w') ? -1 : 0;
      const sy = handle.includes('s') ? 1 : handle.includes('n') ? -1 : 0;
      if (!snapped.x) {
        const w = Math.max(1, Math.round(r.w));
        out.x = fromCenter || !sx ? Math.round((r.x + r.w / 2 - w / 2) * 2) / 2 : sx > 0 ? r.x : r.x + r.w - w;
        out.w = w;
      }
      if (!snapped.y) {
        const h = Math.max(1, Math.round(r.h));
        out.y = fromCenter || !sy ? Math.round((r.y + r.h / 2 - h / 2) * 2) / 2 : sy > 0 ? r.y : r.y + r.h - h;
        out.h = h;
      }
      return out;
    }

    function move(pt) {
      const delta = { x: pt.page.x - start.page.x, y: pt.page.y - start.page.y };
      const keepAspect = single ? keepDefault !== !!pt.shift : !!pt.shift;
      const fromCenter = !!pt.alt;
      let r = geometry.resize(base, handle, delta, { rotation, keepAspect, fromCenter, minW: 1, minH: 1 });
      let guides = [];
      let snapped = { x: null, y: null };
      const snap = ctx.snapConfig(pt);
      if (snap.enabled && !rotation) {
        const sr = snapping.snapResize({
          rect: r, handle, index, grid: snap.grid, gridSize: snap.gridSize, threshold: snap.threshold, objects: snap.objects,
          keepAspect, fromCenter, minW: 1, minH: 1
        });
        if (sr && sr.rect) { r = sr.rect; guides = sr.guides || []; snapped = sr.snapped || snapped; }
      }
      r = roundRect(r, snapped, fromCenter);
      const boxes = [];
      if (single) {
        boxes.push(ctx.localBox(items[0], { cx: r.x + r.w / 2, cy: r.y + r.h / 2, w: r.w, h: r.h }));
      } else {
        const sx = base.w ? r.w / base.w : 1;
        const sy = base.h ? r.h / base.h : 1;
        for (const it of movable) {
          const c0x = it.wr.x + it.wr.w / 2;
          const c0y = it.wr.y + it.wr.h / 2;
          const rad = ((it.wr.rotation || 0) * Math.PI) / 180;
          const cos = Math.cos(rad);
          const sin = Math.sin(rad);
          const fw = it.wr.rotation ? Math.hypot(cos * sx, sin * sy) : sx;
          const fh = it.wr.rotation ? Math.hypot(sin * sx, cos * sy) : sy;
          boxes.push(ctx.localBox(it, {
            cx: r.x + (c0x - base.x) * sx, cy: r.y + (c0y - base.y) * sy,
            w: Math.max(1, it.wr.w * fw), h: Math.max(1, it.wr.h * fh)
          }));
        }
      }
      lastBoxes = boxes;
      if (ctx.applyBoxes(boxes, { coalesce: key, label })) changed = true;
      ctx.overlay.set({ guides, spacing: [], hideHover: true, label: ctx.fmt(r.w) + ' × ' + ctx.fmt(r.h) });
    }

    return {
      name: 'resize',
      handle,
      cursor: ctx.overlay.cursorFor({ type: 'handle', handle }),
      move,
      end() {
        ctx.overlay.clear();
        if (!changed) return;
        ctx.history.finalize(mark, () => ctx.applyBoxes(lastBoxes, { label }));
      },
      cancel() {
        ctx.overlay.clear();
        if (changed) ctx.history.cancel(mark);
      }
    };
  });

  /** rotate: every unlocked top-level node rotates about its own centre; Shift snaps to prefs.snap.rotationStep. */
  registerGesture('rotate', function (ctx, o) {
    const { store, app, canvas } = ctx;
    const docops = app.docops;
    if (!docops) return null;
    const doc = store.doc;
    const bp = store.view.bp;
    const items = [];
    for (const id of docops.topLevel(doc, store.selection)) {
      const wr = canvas.renderer.worldRect(id);
      const eff = schema.effectiveNode(doc, id, bp);
      if (!wr || !eff) continue;
      const it = ctx.boxItem(id, wr, eff);
      if (!it.locked) items.push(it);
    }
    if (!items.length) return null;
    const box = items.length === 1 ? items[0].wr : ctx.unionOf(items);
    const pivot = { x: box.x + box.w / 2, y: box.y + box.h / 2 };
    const start = o.start;
    const a0 = geometry.angleFrom(pivot, start.page);
    const key = ctx.coalesceKey('rotate');
    const mark = ctx.history.mark();
    const label = 'Rotate ' + layerWord(items.length);
    const cursorCorner = o.corner || 'ne';
    let changed = false;
    let last = null;

    function targets(pt) {
      const d = geometry.angleFrom(pivot, pt.page) - a0;
      const step = Number(store.prefs.snap && store.prefs.snap.rotationStep) || 15;
      return items.map((it) => {
        let world = (it.wr.rotation || 0) + d;
        world = pt.shift ? geometry.snapAngle(world, step) : Math.round(world * 10) / 10;
        return { it, world: normAngle(world), local: normAngle((it.eff.rotation || 0) + (world - (it.wr.rotation || 0))) };
      });
    }

    function apply(list, opts) {
      let did = false;
      const run = () => {
        for (const t of list) {
          if (docops.setBox(store, t.it.id, { rotation: t.local }, { coalesce: opts.coalesce })) did = true;
        }
      };
      if (list.length === 1) run(); else store.transact(label, run, { coalesce: opts.coalesce });
      return did;
    }

    return {
      name: 'rotate',
      get cursor() { return ctx.overlay.cursorFor({ type: 'rotate', corner: cursorCorner }); },
      move(pt) {
        last = targets(pt);
        if (apply(last, { coalesce: key })) changed = true;
        ctx.overlay.set({ rotation: { angle: last[0].world, clientX: pt.clientX, clientY: pt.clientY }, hideHandles: true, hideHover: true });
        ctx.setCursor(ctx.overlay.cursorFor({ type: 'rotate', corner: cursorCorner }));
      },
      end() {
        ctx.overlay.clear();
        if (!changed) return;
        ctx.history.finalize(mark, () => apply(last, {}));
      },
      cancel() {
        ctx.overlay.clear();
        if (changed) ctx.history.cancel(mark);
      }
    };
  });

  /** marquee: rubber-band selection of a container's direct children (Alt = fully contained, Shift = add). */
  registerGesture('marquee', function (ctx, o) {
    const { store, canvas } = ctx;
    const doc = store.doc;
    const scope = o.scope && own(doc.nodes, o.scope) ? o.scope : canvas.renderer.rootId;
    const start = o.start;
    const startSel = store.selection.slice();
    const base = Array.isArray(o.base) ? o.base.slice() : [];
    const docops = ctx.app.docops;
    const scopeNode = scope ? doc.nodes[scope] : null;
    const children = [];
    for (const cid of (scopeNode && scopeNode.children) || []) {
      if (docops && docops.isLocked(doc, cid)) continue;
      const r = canvas.renderer.bounds([cid]);
      if (r) children.push({ id: cid, r });
    }
    let current = startSel;

    return {
      name: 'marquee',
      scope,
      cursor: 'default',
      move(pt) {
        const x1 = Math.min(start.page.x, pt.page.x);
        const y1 = Math.min(start.page.y, pt.page.y);
        const rect = { x: x1, y: y1, w: Math.abs(pt.page.x - start.page.x), h: Math.abs(pt.page.y - start.page.y) };
        const hits = children.filter((c) => (pt.alt ? geometry.contains(rect, c.r) : geometry.intersects(rect, c.r))).map((c) => c.id);
        const next = pt.shift || o.additive ? Array.from(new Set(base.concat(hits))) : hits;
        if (!util.deepEqual(next, current)) {
          current = next;
          store.select(next);
        }
        ctx.overlay.set({ marquee: rect, hideHover: true });
      },
      end() {
        ctx.overlay.clear();
        if (current.length) ctx.announce(util.plural ? util.plural(current.length, 'layer') + ' selected' : current.length + ' selected');
      },
      cancel() {
        ctx.overlay.clear();
        store.select(startSel);
      }
    };
  });

  /* ============================================================ select tool */

  registerTool('select', {
    cursor: 'default',

    down(ctx, pt) {
      const { store, canvas } = ctx;
      const renderer = canvas.renderer;
      const hit = ctx.overlay.hitTest(pt.clientX, pt.clientY, { coarse: pt.coarse });
      if (hit && (hit.type === 'handle' || hit.type === 'rotate')) {
        return {
          cursor: ctx.overlay.cursorFor(hit),
          drag: (p) => hit.type === 'handle'
            ? ctx.gesture('resize', { handle: hit.handle, start: pt })
            : ctx.gesture('rotate', { corner: hit.corner, start: pt }),
          click() {}
        };
      }
      let target = renderer.nodeAt(pt.clientX, pt.clientY, { deep: pt.mod });
      if (target && target === renderer.rootId) target = null;
      const sel = store.selection.slice();
      const inBody = !!(hit && hit.type === 'body');
      const moveSel = (p, ids) => ctx.gesture('move', { ids: ids || store.selection, start: pt, duplicate: p.alt || pt.alt }) || ctx.stackDrag(ids || store.selection, pt);
      const marqueeIn = (scope, additive) => ctx.gesture('marquee', { scope, start: pt, base: additive ? store.selection : [], additive });

      if (!target) {
        if (inBody && !pt.shift && !pt.mod && sel.length && ctx.movableIds(sel).length) {
          return { drag: (p) => moveSel(p, sel), click: () => ctx.selectTarget(null) };
        }
        const ctxId = store.view.context && own(store.doc.nodes, store.view.context) ? store.view.context : renderer.rootId;
        return {
          drag: () => marqueeIn(ctxId, pt.shift),
          click: () => { if (!pt.shift) ctx.selectTarget(null); }
        };
      }

      const selected = sel.includes(target);
      if (pt.shift) {
        if (selected) return { drag: (p) => moveSel(p, sel), click: () => store.select([target], 'remove') };
        store.select([target], 'add');
        return { drag: (p) => moveSel(p, store.selection), click() {} };
      }

      if (selected) {
        if (!ctx.movableIds(sel).length && ctx.isMarqueeContainer(target) && !ctx.hasGesture('reorder')) {
          return { drag: () => marqueeIn(target, false), click: () => { if (sel.length > 1) ctx.selectTarget(target); } };
        }
        return { drag: (p) => moveSel(p, sel), click: () => { if (sel.length > 1) ctx.selectTarget(target); } };
      }

      if (ctx.isMarqueeContainer(target)) {
        if (inBody && sel.length && ctx.movableIds(sel).length) {
          return { drag: (p) => moveSel(p, sel), click: () => ctx.selectTarget(target) };
        }
        return { drag: () => marqueeIn(target, false), click: () => ctx.selectTarget(target) };
      }

      ctx.selectTarget(target);
      return { drag: (p) => moveSel(p, [target]), click() {} };
    },

    dblclick(ctx, pt) {
      const { store, canvas, app } = ctx;
      const renderer = canvas.renderer;
      const rootId = renderer.rootId;
      const deep = renderer.nodeAt(pt.clientX, pt.clientY, { deep: true });
      if (!deep || deep === rootId) return false;
      const target = renderer.nodeAt(pt.clientX, pt.clientY, { deep: false });
      const node = target ? store.node(target) : null;
      if (!node) return false;
      if (target !== deep && Array.isArray(node.children)) {
        // Enter the group: the next level under the pointer becomes selectable.
        store.setView({ context: target });
        const inner = renderer.nodeAt(pt.clientX, pt.clientY, { deep: false });
        if (inner && inner !== target) {
          store.select([inner]);
          ctx.announce('Entered ' + (node.name || 'group'));
        }
        return true;
      }
      const def = elements.get(node.type);
      if (def && def.textEdit && !(app.docops && app.docops.isLocked(store.doc, target))) {
        if (!store.selection.includes(target) || store.selection.length !== 1) store.select([target]);
        canvas.startTextEdit(target);
        return true;
      }
      return false;
    },

    hover(ctx, pt) {
      const hit = ctx.overlay.hitTest(pt.clientX, pt.clientY, { coarse: pt.coarse });
      const cursor = ctx.overlay.cursorFor(hit);
      if (hit && hit.type !== 'body') return { hover: null, cursor };
      let id = ctx.canvas.renderer.nodeAt(pt.clientX, pt.clientY, { deep: pt.mod });
      if (id === ctx.canvas.renderer.rootId) id = null;
      return { hover: id, cursor };
    }
  });

  /* ================================================================ create */

  function create(opts) {
    const o = opts || {};
    const app = o.app;
    const canvas = o.canvas;
    if (!app || !canvas || !canvas.el) throw new TypeError('interaction.create({ app, canvas }) needs the app and a mounted canvas');
    const store = app.store;
    const el = canvas.el;
    const ownerDoc = el.ownerDocument || document;
    const win = ownerDoc.defaultView || window;
    const raf = typeof win.requestAnimationFrame === 'function' ? win.requestAnimationFrame.bind(win) : (fn) => setTimeout(fn, 16);
    const caf = typeof win.cancelAnimationFrame === 'function' ? win.cancelAnimationFrame.bind(win) : clearTimeout;
    const perfNow = () => (win.performance && typeof win.performance.now === 'function' ? win.performance.now() : Date.now());
    const localTools = new Map();
    const localGestures = new Map();
    const offs = [];
    let destroyed = false;
    let active = null;
    let hoverFrame = 0;
    let hoverPt = null;
    let cursor = '';
    const perf = { count: 0, total: 0, max: 0, samples: [] };

    const noopOverlay = {
      set() {}, clear() {}, hitTest() { return null; }, cursorFor() { return ''; }, invalidate() {}
    };

    /* ------------------------------------------------------------ ctx */

    const isMac = () => !!(app.env && app.env.mac);
    const modKey = (e) => !!(e && (isMac() ? e.metaKey : e.ctrlKey));

    function point(e, base) {
      const cx = e && Number.isFinite(e.clientX) ? e.clientX : base ? base.clientX : 0;
      const cy = e && Number.isFinite(e.clientY) ? e.clientY : base ? base.clientY : 0;
      const hasMods = e && typeof e.shiftKey === 'boolean';
      return {
        clientX: cx,
        clientY: cy,
        page: canvas.viewport.screenToPage(cx, cy),
        shift: hasMods ? e.shiftKey : !!(base && base.shift),
        alt: hasMods ? e.altKey : !!(base && base.alt),
        mod: hasMods ? modKey(e) : !!(base && base.mod),
        coarse: e && e.pointerType ? e.pointerType !== 'mouse' : !!(app.env && app.env.coarse),
        pointerType: (e && e.pointerType) || (base && base.pointerType) || 'mouse',
        event: e || null
      };
    }

    function historyMark() {
      const h = store.history();
      return { index: h.index, length: h.entries.length };
    }

    const history = {
      mark: historyMark,
      /** Undo everything recorded since `mark` (the gesture's own entries). */
      cancel(mark) {
        let guard = 1000;
        let h = store.history();
        if (h.index === mark.index && mark.length >= 500 && store.canUndo()) { store.undo(); return; }
        while (h.index > mark.index && store.canUndo() && guard-- > 0) {
          store.undo();
          h = store.history();
        }
      },
      /** Ensure the gesture produced one undo entry: if the coalesce window lapsed, replay it once. */
      finalize(mark, reapply) {
        const h = store.history();
        if (h.index - mark.index <= 1 || typeof reapply !== 'function') return;
        history.cancel(mark);
        reapply();
      }
    };

    function snapConfig(pt) {
      const sp = store.prefs.snap || {};
      const objects = sp.objects !== false;
      const grid = !!sp.grid;
      const z = canvas.viewport.zoom || 1;
      const thr = Number.isFinite(sp.threshold) ? sp.threshold : 6;
      return {
        enabled: !(pt && pt.mod) && (objects || grid),
        objects, grid,
        gridSize: Number(sp.gridSize) > 0 ? Number(sp.gridSize) : 8,
        threshold: thr / z,
        rotationStep: Number(sp.rotationStep) > 0 ? Number(sp.rotationStep) : 15
      };
    }

    /** Snap candidates: visible siblings of the moving nodes (excluding them) and their first parent. */
    function snapTargets(ids, extraOthers) {
      const doc = store.doc;
      const moving = new Set(ids);
      const parents = [];
      for (const id of ids) {
        const n = own(doc.nodes, id) ? doc.nodes[id] : null;
        if (n && n.parent && !parents.includes(n.parent)) parents.push(n.parent);
      }
      const others = [];
      for (const pid of parents) {
        const p = doc.nodes[pid];
        for (const cid of (p && p.children) || []) {
          if (moving.has(cid)) continue;
          const r = canvas.renderer.bounds([cid]);
          if (r) others.push(r);
        }
      }
      for (const id of extraOthers || []) {
        if (moving.has(id)) continue;
        const r = canvas.renderer.bounds([id]);
        if (r) others.push(r);
      }
      const parent = parents.length ? canvas.renderer.bounds([parents[0]]) : null;
      return { others, parent };
    }

    function movableIds(ids) {
      const d = app.docops;
      if (!d) return [];
      const doc = store.doc;
      const bp = store.view.bp;
      return d.topLevel(doc, ids || []).filter((id) => {
        if (d.isLocked(doc, id)) return false;
        const n = doc.nodes[id];
        if (!n || !n.parent) return false;
        const p = schema.effectiveNode(doc, n.parent, bp);
        return !(p && p.layout && p.layout.mode === 'stack');
      });
    }

    function parentRotation(id) {
      const n = store.node(id);
      if (!n || !n.parent) return 0;
      const pr = canvas.renderer.worldRect(n.parent);
      return pr ? pr.rotation || 0 : 0;
    }

      host: () => (session ? session.host : null),

    dialog, confirm, prompt, toast, menu, announce,
    closeMenus: () => closeAll('api'),
    get openDialogs() { return openDialogs.slice(); },
    get menuOpen() { return !!(rootMenu && rootMenu.pop.isOpen); },
    get toasts() { return toasts.map((t) => t.api); }

<script data-src="js/ui/palette.js">
/*
 * palette — command palette (ARCHITECTURE.md §6.8, §8; PLAN B2).
 *
 * A modal combobox + listbox (aria-activedescendant) that fuzzy-searches
 *   • commands (title, category, formatted shortcut, id; disabled ones are greyed and not runnable),
 *   • "Insert <Element>" entries from the element registry (inserted at the viewport centre),
 *   • "Go to <layer>" entries for the nodes of the current page (select + scroll into view).
 * Recently run commands are listed first. Prefixes narrow the search: `>` commands, `@` layers, `+` insert.
 *
 * Module API: open(app, { query }) → api | null, close(), toggle(app, opts), isOpen, search(app, query) → entries,
 * recent(app) → ids, remember(app, id), PREFIXES, MAX_RECENT, MAX_RESULTS.
 * The plugin in this file registers `view.palette` (Mod+K, Mod+Shift+P) and its menu entries.
 */
APB.define('palette', ['util', 'commands', 'widgets', 'icons', 'dialogs', 'schema'],
  function (util, commands, widgets, icons, dialogs, schema) {
    'use strict';

    const { h } = widgets;
    const MAX_RECENT = 8;
    const MAX_RESULTS = 120;
    const MAX_LAYERS = 5000;
    const PREFIXES = { '>': 'commands', '@': 'layers', '+': 'insert' };
    const PALETTE_COMMAND = 'view.palette';
    const TOGGLE_KEYS = ['Mod+K', 'Mod+Shift+P'];
    const MODE_PLACEHOLDER = {
      all: 'Search commands, layers, or insert…',
      commands: 'Search commands…',
      layers: 'Go to layer…',
      insert: 'Insert an element…'
    };
    const MODE_LABEL = { commands: 'Commands', layers: 'Layers', insert: 'Insert' };

    let current = null; // the open palette

    /* ------------------------------------------------------------------ styles */

    const CSS = `
.apb-dialog.apb-palette { width: min(640px, calc(100vw - 32px)); margin: min(12vh, 96px) auto auto; max-height: min(600px, calc(100vh - 48px)); }
.apb-palette .apb-dialog-header { display: none; }
.apb-palette .apb-dialog-body { padding: 0; gap: 0; overflow: hidden; }
.apb-palette-search { display: flex; align-items: center; gap: var(--apb-space-2); padding: var(--apb-space-2) var(--apb-space-4); border-bottom: 1px solid var(--apb-border); color: var(--apb-text-muted); }
.apb-palette-search:focus-within { box-shadow: inset 0 -2px 0 var(--apb-focus); }
.apb-palette-input { flex: 1 1 auto; min-width: 0; height: 40px; border: 0; outline: none; background: transparent; color: var(--apb-text); font: inherit; font-size: var(--apb-font-size-lg); }
.apb-palette-input::placeholder { color: var(--apb-text-muted); opacity: 1; }
.apb-palette-mode { flex: none; }
.apb-palette-list { overflow: auto; overscroll-behavior: contain; max-height: min(420px, calc(100vh - 220px)); padding: var(--apb-space-1) var(--apb-space-2) var(--apb-space-2); }
.apb-palette-group-label { padding: var(--apb-space-2) var(--apb-space-2) var(--apb-space-1); font-size: var(--apb-font-size-xs); font-weight: var(--apb-weight-semibold); color: var(--apb-text-muted); letter-spacing: 0.02em; }
.apb-palette-item { display: flex; align-items: center; gap: var(--apb-space-2); min-height: 34px; padding: 0 var(--apb-space-2); border-radius: var(--apb-radius-2); color: var(--apb-text); cursor: pointer; user-select: none; }
.apb-palette-item[aria-selected="true"] { background: var(--apb-active); box-shadow: inset 2px 0 0 var(--apb-accent); }
.apb-palette-item[aria-disabled="true"] { color: var(--apb-text-subtle); cursor: default; }
.apb-palette-item[aria-disabled="true"] .apb-palette-icon, .apb-palette-item[aria-disabled="true"] .apb-kbd { opacity: 0.6; }
.apb-palette-icon { flex: none; display: inline-flex; color: var(--apb-text-muted); }
.apb-palette-label { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.apb-palette-label mark { background: transparent; color: inherit; font-weight: var(--apb-weight-semibold); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; }
.apb-palette-meta { flex: none; max-width: 30%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--apb-font-size-sm); color: var(--apb-text-muted); }
.apb-palette-empty { padding: var(--apb-space-5) var(--apb-space-4); text-align: center; color: var(--apb-text-muted); }
.apb-palette-footer { display: flex; flex-wrap: wrap; align-items: center; gap: var(--apb-space-1) var(--apb-space-3); padding: var(--apb-space-2) var(--apb-space-4); border-top: 1px solid var(--apb-border); background: var(--apb-surface-2); font-size: var(--apb-font-size-xs); color: var(--apb-text-muted); }
.apb-palette-footer span { display: inline-flex; align-items: center; gap: var(--apb-space-1); }
@media (max-width: 600px) { .apb-dialog.apb-palette { margin-top: var(--apb-space-4); } .apb-palette-footer { display: none; } }
@media (forced-colors: active) {
  .apb-palette-item[aria-selected="true"] { outline: 2px solid Highlight; outline-offset: -2px; box-shadow: none; }
  .apb-palette-item[aria-disabled="true"] { color: GrayText; }
}`;

    function ensureStyles() {
      if (typeof document === 'undefined' || document.getElementById('apb-palette-style')) return;
      const style = document.createElement('style');
      style.id = 'apb-palette-style';
      style.textContent = CSS;
      document.head.appendChild(style);
    }

    /* ----------------------------------------------------------------- recents */

    function recent(app) {
      const list = app && app.store && app.store.prefs && app.store.prefs.recentCommands;
      return Array.isArray(list) ? list.filter((id) => typeof id === 'string').slice(0, MAX_RECENT) : [];
    }

    function remember(app, id) {
      if (!app || !app.store || typeof id !== 'string' || id === PALETTE_COMMAND) return;
      const next = [id].concat(recent(app).filter((x) => x !== id)).slice(0, MAX_RECENT);
      app.store.setPrefs({ recentCommands: next });
    }

    /* ----------------------------------------------------------------- entries */

    function parseQuery(raw) {
      const text = String(raw == null ? '' : raw);
      const trimmed = text.replace(/^\s+/, '');
      const first = trimmed.charAt(0);
      if (PREFIXES[first]) return { mode: PREFIXES[first], q: trimmed.slice(1).trim() };
      return { mode: 'all', q: text.trim() };
    }

    function iconName(name, fallback) {
      return name && icons.has(name) ? name : fallback;
    }

    function commandEntries(app) {
      const out = [];
      const rec = recent(app);
      commands.list().forEach((def, i) => {
        if (!def || def.palette === false || def.id === PALETTE_COMMAND) return;
        const keys = Array.isArray(def.keys) ? def.keys : [];
        const title = String(def.title || def.id);
        out.push({
          kind: 'command', id: def.id, title, meta: def.category || 'General',
          icon: iconName(def.icon, 'command'), keys, keysText: keys.length ? commands.formatKeys(keys) : '',
          disabled: !commands.enabled(def.id), recentRank: rec.indexOf(def.id), order: i
        });
      });
      return out;
    }

    function insertEntries(app) {
      const elements = app && app.elements;
      if (!elements || typeof elements.list !== 'function') return [];
      const canInsert = !!(app.canvas && typeof app.canvas.insertAtViewportCenter === 'function');
      return elements.list({ insertable: true }).map((def, i) => ({
        kind: 'insert', id: 'insert:' + def.type, type: def.type, title: 'Insert ' + (def.label || def.type), meta: 'Insert',
        icon: iconName(def.icon, 'insert'), keys: [], keysText: '', disabled: !canInsert, recentRank: -1, order: 1000 + i
      }));
    }

    function layerEntries(app) {
      const store = app && app.store;
      if (!store) return [];
      const doc = store.doc;
      const page = (doc.pages || []).find((p) => p.id === store.view.pageId) || (doc.pages || [])[0];
      if (!page || !page.root) return [];
      const out = [];
      schema.walk(doc, page.root, (node) => {
        if (out.length >= MAX_LAYERS) return false;
        if (node.id === page.root) return undefined;
        const def = app.elements ? app.elements.get(node.type) : null;
        const label = (def && def.label) || node.type;
        const name = String(node.name || label);
        out.push({
          kind: 'layer', id: 'layer:' + node.id, nodeId: node.id, name, title: 'Go to ' + name, meta: label,
          icon: iconName(def && def.icon, 'layers'), keys: [], keysText: '', disabled: false, recentRank: -1, order: 2000 + out.length
        });
        return undefined;
      });
      return out;
    }

    function scoreEntry(entry, q, mode) {
      const f = util.fuzzyScore;
      let score = f(q, entry.title);
      const bonus = (s, add) => (s > 0 ? s + add : 0);
      if (entry.kind === 'layer') score = Math.max(score, bonus(f(q, entry.name), 2), f(q, entry.meta) * 0.5);
      else if (entry.kind === 'insert') score = Math.max(score, bonus(f(q, entry.title.slice(7)), 1));
      else {
        score = Math.max(score, f(q, entry.meta + ' ' + entry.title) * 0.85, f(q, entry.id) * 0.6);
        if (entry.keysText) score = Math.max(score, f(q, entry.keysText) * 0.75);
      }
      // Drop scattered subsequence matches: require roughly 1.5 points per typed character.
      if (score <= 0 || score < q.replace(/\s+/g, '').length * 1.5) return 0;
      if (entry.recentRank >= 0) score += 6 - entry.recentRank * 0.5;
      if (entry.disabled) score *= 0.85;
      if (mode === 'all' && entry.kind === 'layer') score *= 0.9;
      return score;
    }

    /**
     * search(app, query) → ranked entries { kind: 'command'|'insert'|'layer', id, title, meta, icon, keys, keysText, disabled,
     * score, group, positions }. An empty query lists recent commands, then enabled commands, disabled ones, and inserts.
     */
    function search(app, rawQuery) {
      const { mode, q } = parseQuery(rawQuery);
      let pool = [];
      if (mode === 'all' || mode === 'commands') pool = pool.concat(commandEntries(app));
      if (mode === 'all' || mode === 'insert') pool = pool.concat(insertEntries(app));
      if (mode === 'layers' || (mode === 'all' && q)) pool = pool.concat(layerEntries(app));

      if (!q) {
        const rec = pool.filter((e) => e.recentRank >= 0).sort((a, b) => a.recentRank - b.recentRank);
        const rest = pool.filter((e) => e.recentRank < 0);
        const cmds = rest.filter((e) => e.kind === 'command').sort((a, b) => (a.disabled - b.disabled) || (a.order - b.order));
        rec.forEach((e) => { e.group = 'Recently used'; e.score = 1; });
        cmds.forEach((e) => { e.group = 'Commands'; e.score = 1; });
        const inserts = rest.filter((e) => e.kind === 'insert');
        inserts.forEach((e) => { e.group = 'Insert'; e.score = 1; });
        const layers = rest.filter((e) => e.kind === 'layer');
        layers.forEach((e) => { e.group = 'Layers'; e.score = 1; });
        return rec.concat(cmds, inserts, layers).slice(0, mode === 'layers' ? MAX_RESULTS * 4 : MAX_RESULTS * 2);
      }

      const out = [];
      for (const e of pool) {
        const s = scoreEntry(e, q, mode);
        if (s > 0) {
          e.score = s;
          const m = util.fuzzyMatch(q, e.title);
          e.positions = m ? m.positions : [];
          out.push(e);
        }
      }
      out.sort((a, b) => (b.score - a.score) || (a.order - b.order));
      return out.slice(0, MAX_RESULTS);
    }

    /* ---------------------------------------------------------------------- UI */

    function highlight(text, positions) {
      if (!positions || !positions.length) return [text];
      const set = new Set(positions);
      const parts = [];
      let buf = '';
      let marked = false;
      for (let i = 0; i < text.length; i++) {
        const m = set.has(i);
        if (m !== marked && buf) { parts.push(marked ? h('mark', null, buf) : buf); buf = ''; }
        marked = m;
        buf += text[i];
      }
      if (buf) parts.push(marked ? h('mark', null, buf) : buf);
      return parts;
    }

    function announce(app, message) {
      if (app && app.ui && typeof app.ui.announce === 'function') app.ui.announce(message);
      else dialogs.announce(message);
    }

    function close() {
      if (current) current.close();
    }

    function toggle(app, opts) {
      if (current) { close(); return null; }
      return open(app, opts);
    }

    /** open(app, { query }) — opens (or refocuses) the palette. */
    function open(app, opts) {
      const o = opts || {};
      if (current) {
        if (o.query != null) current.setQuery(String(o.query));
        current.focus();

      }

      const listId = widgets.uid('apb-palette-list');

        type: 'text', class: 'apb-palette-input', role: 'combobox', 'aria-expanded': 'true', 'aria-controls': listId,
        'aria-autocomplete': 'list', 'aria-haspopup': 'listbox', 'aria-label': 'Search commands', autocomplete: 'off',
        spellcheck: 'false', placeholder: MODE_PLACEHOLDER.all
      });

      const list = h('div', { class: 'apb-palette-list', id: listId, role: 'listbox', 'aria-label': 'Results' });
      const status = h('div', { class: 'apb-sr-only', role: 'status', 'aria-live': 'polite' });

      const footer = h('div', { class: 'apb-palette-footer', 'aria-hidden': 'true' },
        hint(['ArrowUp', 'ArrowDown'], 'Navigate'), hint('Enter', 'Run'), hint('Escape', 'Close'),
        h('span', null, '> commands · @ layers · + insert'));
      const searchRow = h('div', { class: 'apb-palette-search' }, icons.get('search', { size: 18 }), input, modeBadge);

      let results = [];
      let optionEls = [];
      let active = -1;
      let statusTimer = 0;

      const dlg = dialogs.dialog({
        label: 'Command palette',
        className: 'apb-palette',
        content: [searchRow, list, status, footer],
        initialFocus: input,
        onClose() {
          clearTimeout(statusTimer);
          if (current === api) current = null;
        }
      });

      function setActive(i, scroll) {
        if (active >= 0 && optionEls[active]) optionEls[active].setAttribute('aria-selected', 'false');
        active = results.length ? Math.max(0, Math.min(results.length - 1, i)) : -1;

        } else {
          input.removeAttribute('aria-activedescendant');
        }
      }

      function optionFor(entry, index) {
        const el = h('div', {
          id: listId + '-' + index, role: 'option', class: ['apb-palette-item', 'apb-palette-item--' + entry.kind],
          'aria-selected': 'false', 'aria-disabled': entry.disabled ? 'true' : null,
          dataset: { kind: entry.kind, id: entry.id }
        },
        h('span', { class: 'apb-palette-icon', 'aria-hidden': 'true' }, icons.get(entry.icon, { size: 16 })),
        h('span', { class: 'apb-palette-label' }, highlight(entry.title, entry.positions)),
        entry.meta && entry.kind !== 'insert' ? h('span', { class: 'apb-palette-meta' }, entry.meta) : null,
        entry.keys && entry.keys.length ? widgets.kbd(entry.keys[0]) : null);
        return el;
      }

      function render() {
        const { mode, q } = parseQuery(input.value);
        input.placeholder = MODE_PLACEHOLDER[mode];
        modeBadge.hidden = mode === 'all';
        modeBadge.textContent = MODE_LABEL[mode] || '';
        results = search(app, input.value);
        optionEls = [];
        list.textContent = '';
        const frag = document.createDocumentFragment();
        let groupEl = null;
        let groupName = null;
        results.forEach((entry, i) => {
          const el = optionFor(entry, i);
          optionEls.push(el);
          if (!q && entry.group) {
            if (entry.group !== groupName) {
              groupName = entry.group;
              const labelId = listId + '-g' + i;
              groupEl = h('div', { role: 'group', class: 'apb-palette-group', 'aria-labelledby': labelId },
                h('div', { class: 'apb-palette-group-label', id: labelId, role: 'presentation' }, groupName));
              frag.appendChild(groupEl);
            }
            groupEl.appendChild(el);
          } else {
            frag.appendChild(el);
          }
        });
        if (!results.length) {
          frag.appendChild(h('div', { class: 'apb-palette-empty', role: 'presentation' },
            q ? 'No results for “' + q + '”' : 'Nothing to show'));
        }
        list.appendChild(frag);
        list.scrollTop = 0;
        active = -1;
        const firstEnabled = results.findIndex((e) => !e.disabled);
        setActive(firstEnabled >= 0 ? firstEnabled : 0, false);
        clearTimeout(statusTimer);
        statusTimer = setTimeout(() => {
          status.textContent = results.length ? util.plural(results.length, 'result') + ' available' : 'No results';
        }, 250);
      }

      function activate(index) {
        const entry = results[index];
        if (!entry) return;
        if (entry.disabled) {
          announce(app, entry.title + ' is not available right now');
          return;
        }
        dlg.close();
        try {
          if (entry.kind === 'command') {
            remember(app, entry.id);
            commands.run(entry.id, { source: 'palette' });
          } else if (entry.kind === 'insert') {
            const ids = app.canvas.insertAtViewportCenter({ type: entry.type });
            if (ids && ids.length) announce(app, entry.title.replace(/^Insert /, '') + ' inserted');
          } else if (entry.kind === 'layer') {
            const id = entry.nodeId;
            if (!app.store.node(id)) return;
            app.store.select([id]);
            const vp = app.canvas && app.canvas.viewport;
            if (vp && typeof vp.scrollToNode === 'function') vp.scrollToNode(id);
            announce(app, entry.name + ' selected');
          }
        } catch (err) {
          console.error('[APB] palette action failed:', err);
          if (typeof app.notifyError === 'function') app.notifyError('Could not run “' + entry.title + '”');
        }
      }

      input.addEventListener('input', render);
      input.addEventListener('keydown', (e) => {
        if (e.isComposing || e.keyCode === 229) return;
        if (TOGGLE_KEYS.some((k) => commands.matchKey(e, k))) {
          e.preventDefault();
          dlg.close();
          return;
        }
        const page = 8;
        switch (e.key) {
          case 'ArrowDown':
            e.preventDefault();
            if (results.length) setActive(active >= results.length - 1 ? 0 : active + 1);
            break;
          case 'ArrowUp':
            e.preventDefault();
            if (results.length) setActive(active <= 0 ? results.length - 1 : active - 1);
            break;
          case 'PageDown':
            e.preventDefault();
            setActive(active + page);
            break;
          case 'PageUp':
            e.preventDefault();
            setActive(active - page);
            break;
          case 'Home':
          case 'End':
            if (e.ctrlKey || e.metaKey) {
              e.preventDefault();
              setActive(e.key === 'Home' ? 0 : results.length - 1);
            }
            break;
          case 'Enter':
            e.preventDefault();
            activate(active);
            break;
          case 'Tab':
            e.preventDefault();
            break;
          default:
        }
      });
      list.addEventListener('mousedown', (e) => e.preventDefault()); // keep focus in the input
      list.addEventListener('pointermove', (e) => {
        const opt = e.target.closest && e.target.closest('[role="option"]');
        if (!opt) return;
        const i = optionEls.indexOf(opt);
        if (i >= 0 && i !== active) setActive(i, false);
      });
      list.addEventListener('click', (e) => {
        const opt = e.target.closest && e.target.closest('[role="option"]');
        if (!opt) return;
        const i = optionEls.indexOf(opt);
        if (i >= 0) activate(i);
      });

      const api = {
        el: dlg.el,
        input,
        list,
        get results() { return results.slice(); },
        get active() { return active; },
        closed: dlg.closed,
        close: () => dlg.close(),
        focus() { try { input.focus(); input.select(); } catch (_) { /* ignore */ } },
        setQuery(text) { input.value = text; render(); },
        run: (index) => activate(index == null ? active : index)
      };
      current = api;
      if (o.query != null) input.value = String(o.query);
      render();
      return api;
    }

    return {
      open, close, toggle, search, recent, remember, parseQuery,
      get isOpen() { return !!current; },
      get current() { return current; },
      PREFIXES, MAX_RECENT, MAX_RESULTS
    };
  });

APB.plugin({
  id: 'palette',
  requires: ['palette', 'dialogs', 'widgets'],
  order: 20,
  init(app) {
    'use strict';
    const palette = APB.require('palette');
    const commands = app.commands;
    if (!commands.get('view.palette')) {
      commands.register({
        id: 'view.palette', title: 'Command palette…', category: 'View', icon: 'command',
        keys: ['Mod+K', 'Mod+Shift+P'], allowInInputs: true, palette: false,
        run: (a, args) => palette.open(a, { query: args && typeof args.query === 'string' ? args.query : undefined })
