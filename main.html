/* @node-testable */
/*
 * events — tiny Emitter. Listener errors are reported via console.error and never break emit.
 * See ARCHITECTURE.md §6.2.
 */

  'use strict';

  class Emitter {
    constructor() {
      this._listeners = new Map(); // evt -> array of { fn, once }
    }

    on(evt, fn) {
      if (typeof fn !== 'function') throw new TypeError('Emitter.on: listener must be a function');
      let list = this._listeners.get(evt);
      if (!list) { list = []; this._listeners.set(evt, list); }
      const entry = { fn, once: false };
      list.push(entry);
      return () => this._remove(evt, entry);
    }

    once(evt, fn) {
      if (typeof fn !== 'function') throw new TypeError('Emitter.once: listener must be a function');
      let list = this._listeners.get(evt);
      if (!list) { list = []; this._listeners.set(evt, list); }
      const entry = { fn, once: true };
      list.push(entry);
      return () => this._remove(evt, entry);
    }

    off(evt, fn) {
      const list = this._listeners.get(evt);
      if (!list) return;
      if (fn === undefined) { this._listeners.delete(evt); return; }
      const idx = list.findIndex((e) => e.fn === fn);
      if (idx >= 0) list.splice(idx, 1);
      if (!list.length) this._listeners.delete(evt);
    }

    emit(evt, payload) {
      const list = this._listeners.get(evt);
      if (!list || !list.length) return 0;
      const snapshot = list.slice();
      let called = 0;
      for (const entry of snapshot) {
        if (!list.includes(entry)) continue; // removed by an earlier listener
        if (entry.once) this._remove(evt, entry);
        called++;
        try {
          entry.fn(payload);
        } catch (err) {
          if (typeof console !== 'undefined' && console.error) {
            console.error('[APB] listener for "' + String(evt) + '" threw:', err);
          }
        }
      }
      return called;
    }

    listenerCount(evt) {
      const list = this._listeners.get(evt);
      return list ? list.length : 0;
    }

    clear() {
      this._listeners.clear();
    }

    _remove(evt, entry) {
      const list = this._listeners.get(evt);
      if (!list) return;
      const idx = list.indexOf(entry);
      if (idx >= 0) list.splice(idx, 1);
      if (!list.length) this._listeners.delete(evt);
    }
  }

    const l = Object.assign(base, util.isPlainObject(layout) ? layout : {});
    if (!LAYOUT_MODES.has(l.mode)) l.mode = type === 'page' ? 'stack' : 'free';
    if (!LAYOUT_DIRS.has(l.dir)) l.dir = 'column';
    l.gap = Number.isFinite(l.gap) ? l.gap : DEFAULT_LAYOUT.gap;
    l.pad = normalizePad(l.pad);
    if (!LAYOUT_ALIGN.has(l.align)) l.align = 'start';
    if (!LAYOUT_JUSTIFY.has(l.justify)) l.justify = 'start';
    l.wrap = !!l.wrap;
    return l;
  }

  function normalizePad(pad) {
    if (Number.isFinite(pad)) return [pad, pad, pad, pad];
    if (Array.isArray(pad)) {
      const n = pad.map((v) => (Number.isFinite(v) ? v : 0));
      if (n.length === 1) return [n[0], n[0], n[0], n[0]];
      if (n.length === 2) return [n[0], n[1], n[0], n[1]];
      if (n.length === 3) return [n[0], n[1], n[2], n[1]];
      if (n.length >= 4) return n.slice(0, 4);
    }
    return [0, 0, 0, 0];
  }

  function baseNode(type) {
    return {
      id: '', type, name: '', parent: null,
      x: 0, y: 0, w: 100, h: 100, rotation: 0,
      locked: false, hidden: false,
      sizing: { w: 'fixed', h: 'fixed' },
      layout: null,
      style: {}, props: {}, bp: {}, states: {}, motion: null, attrs: {}, css: ''
    };
  }

  function typeLabel(type) {
    const def = getElementDef(type);
    if (def && def.label) return def.label;
    return String(type).charAt(0).toUpperCase() + String(type).slice(1);
  }

  /**
   * createNode(type, init) → node. Merges (base defaults) ⊕ (element type defaults, or built-in
   * fallbacks when the type is not registered) ⊕ init. Object keys merge one level deep.
   */
  function createNode(type, init) {
    const src = util.isPlainObject(init) ? util.deepClone(init) : {};
    const t = String(type || src.type || 'frame');
    const def = getElementDef(t);
    let node = baseNode(t);
    let typeDefaults = null;
    if (def && typeof def.defaults === 'function') {
      try { typeDefaults = def.defaults() || null; } catch (err) {
        if (typeof console !== 'undefined') console.error('[APB] defaults() of element type "' + t + '" threw:', err);
      }
    } else if (!def && FALLBACK_DEFAULTS[t]) {
      typeDefaults = FALLBACK_DEFAULTS[t]();
    }
    if (typeDefaults) node = util.deepMerge(node, util.omit(util.deepClone(typeDefaults), ['id', 'type', 'children', 'parent']));
    node = util.deepMerge(node, util.omit(src, ['id', 'type', 'children']));
    node.id = isId(src.id) ? src.id : util.uid('n');
    node.type = t;
    if (!node.name) node.name = typeLabel(t);
    if (isContainer(t)) {
      node.children = Array.isArray(src.children) && src.children.every((c) => typeof c === 'string') ? src.children.slice() : [];
      node.layout = fullLayout(node.layout, t);
    } else {
      delete node.children;
      node.layout = null;
    }
    if (!util.isPlainObject(node.sizing)) node.sizing = { w: 'fixed', h: 'fixed' };
    return node;
  }

  function uniqueSlug(doc, name, exceptPageId) {
    const pages = (doc && Array.isArray(doc.pages)) ? doc.pages : [];
    const taken = new Set(pages.filter((p) => p && p.id !== exceptPageId).map((p) => p.slug));
    let base = util.slugify(name, 'page');
    if (!taken.size && !pages.length) base = 'index';
    let slug = base;
    let i = 2;
    while (taken.has(slug)) slug = base + '-' + i++;
    return slug;
  }

  /** createPage(doc, name) → { page, root } — does not modify doc. */
  function createPage(doc, name) {
    const bps = doc && doc.settings && Array.isArray(doc.settings.breakpoints) && doc.settings.breakpoints.length
      ? doc.settings.breakpoints : DEFAULT_BREAKPOINTS;
    const pageName = (typeof name === 'string' && name.trim()) ? name.trim() : 'Page ' + (((doc && doc.pages) || []).length + 1);
    const existingIds = doc && doc.nodes ? doc.nodes : undefined;
    const root = createNode('page', { id: util.uid('n', existingIds), name: pageName, parent: null, w: bps[0].width || 1440 });
    const page = {
      id: util.uid('pg', ((doc && doc.pages) || []).map((p) => p.id)),
      name: pageName,
      slug: uniqueSlug(doc, pageName),
      root: root.id,
      seo: Object.assign({}, DEFAULT_SEO)
    };
    return { page, root };
  }

  function defaultSettings() {
    return {
      lang: 'en',
      breakpoints: DEFAULT_BREAKPOINTS.map((b) => Object.assign({}, b)),
      globalCSS: '',
      fonts: [],
      favicon: '',
      export: {}
    };
  }

  /** createDocument({ name, pageName }) → doc with one page root + one empty free section 1440×900. */
  function createDocument(opts) {
    const o = opts || {};
    const now = new Date().toISOString();
    const doc = {
      format: 'apb',
      version: VERSION,
      id: util.uid('doc'),
      name: (typeof o.name === 'string' && o.name.trim()) ? o.name.trim() : 'Untitled site',
      createdAt: now,
      updatedAt: now,
      settings: defaultSettings(),
      tokens: { colors: [], text: [] },
      assets: {},
      components: {},
      pages: [],
      nodes: {}
    };
    const { page, root } = createPage(doc, (typeof o.pageName === 'string' && o.pageName.trim()) ? o.pageName.trim() : 'Home');
    page.slug = 'index';
    const section = createNode('section', {
      name: 'Section', parent: root.id, x: 0, y: 0, w: 1440, h: 900,
      sizing: { w: 'fill', h: 'fixed' }, layout: { mode: 'free' }
    });
    section.layout = fullLayout(Object.assign({}, section.layout, { mode: 'free' }), 'section');
    root.children = [section.id];
    doc.nodes[root.id] = root;
    doc.nodes[section.id] = section;
    doc.pages.push(page);
    return doc;
  }

  /* ---------------------------------------------------------- traversal */

  function getNode(doc, idOrNode) {
    if (!idOrNode) return null;
    if (typeof idOrNode === 'object') return idOrNode;
    return (doc && doc.nodes && Object.prototype.hasOwnProperty.call(doc.nodes, idOrNode)) ? doc.nodes[idOrNode] : null;
  }

  /** walk(doc, rootId, fn(node, depth)) — pre-order; return false from fn to skip a subtree. */
  function walk(doc, rootId, fn) {
    const start = getNode(doc, rootId);
    if (!start) return;
    const stack = [[start, 0]];
    const seen = new Set();
    while (stack.length) {
      const [node, depth] = stack.pop();
      if (seen.has(node.id)) continue;
      seen.add(node.id);
      if (fn(node, depth) === false) continue;
      const kids = Array.isArray(node.children) ? node.children : [];
      for (let i = kids.length - 1; i >= 0; i--) {
        const child = getNode(doc, kids[i]);
        if (child) stack.push([child, depth + 1]);
      }
    }
  }

  /** ancestors(doc, id) → ids from the parent up to the root. */
  function ancestors(doc, id) {
    const out = [];
    const seen = new Set([id]);
    let node = getNode(doc, id);
    while (node && node.parent && !seen.has(node.parent)) {
      out.push(node.parent);
      seen.add(node.parent);
      node = getNode(doc, node.parent);
    }
    return out;
  }

  /** descendants(doc, id) → ids of all descendants in pre-order (excluding id). */
  function descendants(doc, id) {
    const out = [];
    const rootId = typeof id === 'object' && id ? id.id : id;
    walk(doc, id, (node) => { if (node.id !== rootId) out.push(node.id); });
    return out;
  }

  function rootOf(doc, id) {
    const anc = ancestors(doc, id);
    if (anc.length) return anc[anc.length - 1];
    return getNode(doc, id) ? (typeof id === 'object' ? id.id : id) : null;
  }

  function pageOf(doc, id) {
    const root = rootOf(doc, id);
    if (!root || !doc || !Array.isArray(doc.pages)) return null;
    return doc.pages.find((p) => p.root === root) || null;
  }

  function indexInParent(doc, id) {
    const node = getNode(doc, id);
    if (!node || !node.parent) return -1;
    const parent = getNode(doc, node.parent);
    return parent && Array.isArray(parent.children) ? parent.children.indexOf(node.id) : -1;
  }

  function bpIndex(doc, bpId) {
    const bps = doc && doc.settings && Array.isArray(doc.settings.breakpoints) ? doc.settings.breakpoints : DEFAULT_BREAKPOINTS;
    if (!bpId) return 0;
    return bps.findIndex((b) => b.id === bpId);
  }

  /* ---------------------------------------------------- breakpoint cascade */

  const effCache = new WeakMap(); // node -> Map(bpId -> { bps, bpProps, eff })

  function applyOverride(eff, over, allowedProps) {
    const out = Object.assign({}, eff);
    for (const key of BP_KEYS) {
      if (!Object.prototype.hasOwnProperty.call(over, key)) continue;
      const val = over[key];
      if (val === undefined) continue;
      if (CASCADE_MERGE_KEYS.has(key) && util.isPlainObject(val)) {
        const merged = Object.assign({}, util.isPlainObject(out[key]) ? out[key] : {});
        for (const k of Object.keys(val)) {
          if (val[k] === undefined) continue;
          if (key === 'props' && allowedProps && !allowedProps.includes(k)) continue;
          merged[k] = val[k];
        }
        out[key] = merged;
      } else if (key !== 'props') {
        out[key] = val;
      }
    }
    return out;
  }

  /**
   * effectiveNode(doc, node|id, bpId) → node after cascade base ⊕ bp[b1] ⊕ … ⊕ bp[bk].
   * Returns the node itself at the base breakpoint or when no override applies.
   */
  function effectiveNode(doc, idOrNode, bpId) {
    const node = getNode(doc, idOrNode);
    if (!node) return null;
    const bps = doc && doc.settings && Array.isArray(doc.settings.breakpoints) ? doc.settings.breakpoints : DEFAULT_BREAKPOINTS;
    const idx = bpId ? bps.findIndex((b) => b.id === bpId) : 0;
    if (idx <= 0 || !node.bp || typeof node.bp !== 'object') return node;
    const def = getElementDef(node.type);
    const allowedProps = def ? (Array.isArray(def.bpProps) ? def.bpProps : []) : null;
    let perNode = effCache.get(node);
    const hit = perNode && perNode.get(bpId);
    if (hit && hit.bps === bps && hit.allowedProps === allowedProps) return hit.eff;
    let eff = node;
    for (let i = 1; i <= idx; i++) {
      const over = node.bp[bps[i].id];
      if (util.isPlainObject(over) && Object.keys(over).length) eff = applyOverride(eff, over, allowedProps);
    }
    if (!perNode) { perNode = new Map(); effCache.set(node, perNode); }
    perNode.set(bpId, { bps, allowedProps, eff });
    return eff;
  }

  /* --------------------------------------------------------------- reid */

  /**
   * reid(nodesMap, rootIds) → { nodes, idMap } — deep copies the subtrees under rootIds with fresh
   * ids. Roots keep their original `parent`; children/parent links inside the subtrees are remapped.
   */
  function reid(nodesMap, rootIds) {
    const src = nodesMap || {};
    const roots = (Array.isArray(rootIds) ? rootIds : [rootIds]).filter((id) => src[id]);
    const order = [];
    const seen = new Set();
    const stack = roots.slice().reverse();
    while (stack.length) {
      const id = stack.pop();
      if (seen.has(id) || !src[id]) continue;
      seen.add(id);
      order.push(id);
      const kids = Array.isArray(src[id].children) ? src[id].children : [];
      for (let i = kids.length - 1; i >= 0; i--) stack.push(kids[i]);
    }
    const idMap = {};
    const taken = new Set(Object.keys(src));
    for (const id of order) {
      const nid = util.uid('n', taken);
      taken.add(nid);
      idMap[id] = nid;
    }
    const nodes = {};
    for (const id of order) {
      const copy = util.deepClone(src[id]);
      copy.id = idMap[id];
      if (copy.parent && idMap[copy.parent]) copy.parent = idMap[copy.parent];
      if (Array.isArray(copy.children)) copy.children = copy.children.filter((c) => idMap[c]).map((c) => idMap[c]);
      nodes[copy.id] = copy;
    }
    return { nodes, idMap };
  }

  /* ------------------------------------------------------ normalization */

  const num = (v, d) => (typeof v === 'number' && Number.isFinite(v) ? v : d);
  const str = (v, d) => (typeof v === 'string' ? v : d);
  const obj = (v) => (util.isPlainObject(v) ? v : {});

  function normalizeBreakpoints(list, warnings) {
    if (!Array.isArray(list) || !list.length) {
      if (list !== undefined) warnings.push('Invalid breakpoints replaced with defaults');
      return DEFAULT_BREAKPOINTS.map((b) => Object.assign({}, b));
    }
    const seen = new Set();
    const out = [];
    list.forEach((b, i) => {
      if (!util.isPlainObject(b) || typeof b.id !== 'string' || !b.id || seen.has(b.id) || !(num(b.width, 0) > 0)) {
        warnings.push('Dropped invalid breakpoint #' + i);
        return;
      }
      seen.add(b.id);
      const bp = { id: b.id, label: str(b.label, b.id), width: b.width };
      if (out.length && Number.isFinite(b.max)) bp.max = b.max;
      else if (out.length === 1) bp.max = Math.max(b.width, 1023);
      else if (out.length) bp.max = Math.max(0, out[out.length - 1].width - 1);
      out.push(bp);
    });
    return out.length ? out : DEFAULT_BREAKPOINTS.map((b) => Object.assign({}, b));
  }

  function normalizeNodeFields(id, raw, warnings) {
    const type = typeof raw.type === 'string' && raw.type ? raw.type : 'frame';
    if (type !== raw.type) warnings.push('Node ' + id + ' had no type; set to "frame"');
    const base = baseNode(type);
    const n = Object.assign({}, raw);
    n.id = id;
    n.type = type;
    n.name = str(n.name, '') || typeLabel(type);
    for (const k of ['x', 'y', 'w', 'h', 'rotation']) n[k] = num(n[k], base[k]);
    if (n.w < 0) n.w = 0;
    if (n.h < 0) n.h = 0;
    n.locked = !!n.locked;
    n.hidden = !!n.hidden;
    const sz = obj(n.sizing);
    n.sizing = { w: SIZING_VALUES.has(sz.w) ? sz.w : 'fixed', h: SIZING_VALUES.has(sz.h) ? sz.h : 'fixed' };
    n.style = obj(n.style);
    n.props = obj(n.props);
    n.bp = obj(n.bp);
    n.states = obj(n.states);
    n.attrs = obj(n.attrs);
    n.motion = util.isPlainObject(n.motion) ? n.motion : null;
    n.css = str(n.css, '');
    n.parent = typeof n.parent === 'string' ? n.parent : null;
    if (isContainer(type)) {
      n.children = Array.isArray(n.children) ? n.children.filter((c) => typeof c === 'string') : [];
      n.layout = fullLayout(n.layout, type);
    } else {
      if (Array.isArray(n.children) && n.children.length) warnings.push('Removed children from non-container ' + id);
      delete n.children;
      n.layout = null;
    }
    return n;
  }

  /**
   * normalizeDocument(doc) → { doc, warnings }. Never mutates the input. Repairs parent/children
   * links (first claim wins, cycles broken), removes unreachable nodes and dangling refs, fills
   * defaults.
   */
  function normalizeDocument(input) {
    const warnings = [];
    if (!util.isPlainObject(input)) {
      warnings.push('Document was not an object; created a new document');
      return { doc: createDocument(), warnings };
    }
    const src = util.deepClone(input);
    if (src.format !== undefined && src.format !== 'apb') warnings.push('Unknown format "' + src.format + '"');
    if (typeof src.version === 'number' && src.version > VERSION) warnings.push('Document version ' + src.version + ' is newer than supported (' + VERSION + ')');
    const now = new Date().toISOString();
    const doc = {
      format: 'apb',
      version: VERSION,
      id: isId(src.id) ? src.id : util.uid('doc'),
      name: str(src.name, '') || 'Untitled site',
      createdAt: str(src.createdAt, now),
      updatedAt: str(src.updatedAt, now),
      settings: null,
      tokens: null,
      assets: {},
      components: {},
      pages: [],
      nodes: {}
    };
    // Unknown top-level extension keys are preserved.
    for (const k of Object.keys(src)) if (!(k in doc)) doc[k] = src[k];

    const s = obj(src.settings);
    doc.settings = Object.assign(defaultSettings(), s, {
      lang: str(s.lang, '') || 'en',
      breakpoints: normalizeBreakpoints(s.breakpoints, warnings),
      globalCSS: str(s.globalCSS, ''),
      fonts: Array.isArray(s.fonts) ? s.fonts.filter(util.isPlainObject) : [],
      favicon: str(s.favicon, ''),
      export: obj(s.export)
    });

    const t = obj(src.tokens);
    const tokenIds = new Set();
    const validToken = (tok, field) => {
      if (!util.isPlainObject(tok) || typeof tok.id !== 'string' || !tok.id || tokenIds.has(field + ':' + tok.id)) return false;
      tokenIds.add(field + ':' + tok.id);
      return true;
    };
    doc.tokens = Object.assign({}, t, {
      colors: (Array.isArray(t.colors) ? t.colors : []).filter((c) => validToken(c, 'c') && typeof c.value === 'string')
        .map((c) => Object.assign({}, c, { name: str(c.name, c.id) })),
      text: (Array.isArray(t.text) ? t.text : []).filter((c) => validToken(c, 't'))
        .map((c) => Object.assign({}, c, { name: str(c.name, c.id), style: obj(c.style) }))
    });

    for (const [key, a] of Object.entries(obj(src.assets))) {
      if (!util.isPlainObject(a)) { warnings.push('Dropped invalid asset ' + key); continue; }
      doc.assets[key] = Object.assign({}, a, { id: key });
    }

    // Nodes: basic field repair.
    for (const [key, raw] of Object.entries(obj(src.nodes))) {
      if (!util.isPlainObject(raw)) { warnings.push('Dropped invalid node ' + key); continue; }
      if (raw.id !== undefined && raw.id !== key) warnings.push('Node id mismatch fixed for ' + key);
      doc.nodes[key] = normalizeNodeFields(key, raw, warnings);
    }
    const nodes = doc.nodes;

    // Pages.
    const pageIds = new Set();
    const rootIds = new Set();
    const rawPages = Array.isArray(src.pages) ? src.pages : [];
    for (const rp of rawPages) {
      if (!util.isPlainObject(rp)) { warnings.push('Dropped invalid page'); continue; }
      const page = Object.assign({}, rp);
      if (!isId(page.id) || pageIds.has(page.id)) page.id = util.uid('pg', pageIds);
      pageIds.add(page.id);
      page.name = str(page.name, '') || 'Page ' + (doc.pages.length + 1);
      page.seo = Object.assign({}, DEFAULT_SEO, obj(page.seo));
      let root = nodes[page.root];
      if (!root || rootIds.has(page.root)) {
        warnings.push('Page "' + page.name + '" had a missing or shared root; created a new root');
        const fresh = createNode('page', { id: util.uid('n', nodes), name: page.name, w: doc.settings.breakpoints[0].width });
        nodes[fresh.id] = fresh;
        page.root = fresh.id;
        root = fresh;
      } else if (root.type !== 'page') {
        warnings.push('Page "' + page.name + '" root was a ' + root.type + '; wrapped in a page root');
        const fresh = createNode('page', { id: util.uid('n', nodes), name: page.name, w: doc.settings.breakpoints[0].width });
        fresh.children = [root.id];
        root.parent = fresh.id;
        nodes[fresh.id] = fresh;
        page.root = fresh.id;
      }
      rootIds.add(page.root);
      nodes[page.root].parent = null;
      page.slug = util.slugify(str(page.slug, '') || page.name, 'page');
      doc.pages.push(page);
    }
    // Unique slugs (first page defaults to index when its slug is empty).
    const slugs = new Set();
    doc.pages.forEach((p) => {
      let slug = p.slug;
      let i = 2;
      while (slugs.has(slug)) slug = p.slug + '-' + i++;
      p.slug = slug;
      slugs.add(slug);
    });

    // Components.
    for (const [key, c] of Object.entries(obj(src.components))) {
      if (!util.isPlainObject(c) || !nodes[c.root] || rootIds.has(c.root)) {
        warnings.push('Dropped component ' + key + ' (missing root)');
        continue;
      }
      doc.components[key] = Object.assign({}, c, { id: key, name: str(c.name, '') || 'Component' });
      rootIds.add(c.root);
      nodes[c.root].parent = null;
    }

    // Nodes whose parent points at a container that does not list them get appended.
    for (const n of Object.values(nodes)) {
      if (rootIds.has(n.id) || !n.parent) continue;
      const p = nodes[n.parent];
      if (p && Array.isArray(p.children) && !p.children.includes(n.id)) {
        p.children = p.children.concat(n.id);
        warnings.push('Re-linked node ' + n.id + ' into its parent');
      }
    }

    // Reachability from roots (breadth-first). When several containers list the same child, the
    // container named by the child's own `parent` field wins; otherwise the first claim wins.
    // Cycles and duplicates are cut.
    const visited = new Set(rootIds);
    const entries = new Map(); // containerId -> [{ id, keep }]
    let queue = Array.from(rootIds);
    const claimedBy = (cid, containerId) => {
      visited.add(cid);
      if (nodes[cid].parent !== containerId) nodes[cid].parent = containerId;
      queue.push(cid);
    };
    while (queue.length) {
      const batch = queue;
      queue = [];
      for (const id of batch) {
        const node = nodes[id];
        if (!Array.isArray(node.children)) continue;
        const list = [];
        for (const cid of node.children) {
          if (!nodes[cid]) { warnings.push('Removed dangling child ref ' + cid); continue; }
          if (visited.has(cid) || list.some((e) => e.id === cid)) { warnings.push('Removed duplicate/cyclic child ref ' + cid); continue; }
          const hint = nodes[cid].parent;
          const hinted = hint && hint !== id && nodes[hint] && Array.isArray(nodes[hint].children) && nodes[hint].children.includes(cid);
          if (hinted) { list.push({ id: cid, keep: false }); continue; }
          list.push({ id: cid, keep: true });
          claimedBy(cid, id);
        }
        entries.set(id, list);
      }
      if (!queue.length) {
        // Deferred claims whose hinted parent never claimed them (e.g. unreachable) fall back here.
        for (const [containerId, list] of entries) {
          for (const e of list) {
            if (!e.keep && !visited.has(e.id)) { e.keep = true; claimedBy(e.id, containerId); }
          }
        }
      }
    }
    for (const [containerId, list] of entries) {
      const kept = list.filter((e) => e.keep).map((e) => e.id);
      const node = nodes[containerId];
      if (kept.length !== node.children.length || kept.some((k, i) => node.children[i] !== k)) {
        if (list.some((e) => !e.keep)) warnings.push('Resolved duplicate claims in ' + containerId);
        node.children = kept;
      }
    }
    const unreachable = Object.keys(nodes).filter((id) => !visited.has(id));
    if (unreachable.length) {
      warnings.push('Removed ' + unreachable.length + ' unreachable node(s)');
      unreachable.forEach((id) => delete nodes[id]);
    }

    // Instances referencing missing components.
    for (const n of Object.values(nodes)) {
      if (n.type === 'instance' && !(n.props && doc.components[n.props.component])) {
        warnings.push('Instance ' + n.id + ' references a missing component');
      }
    }

    if (!doc.pages.length) {
      warnings.push('Document had no pages; added one');
      const { page, root } = createPage(doc, 'Home');
      page.slug = slugs.has('index') ? page.slug : 'index';

      index = 0;

    function emitView(previous) {

      if (!util.isPlainObject(patch)) return false;
      const next = Object.assign({}, view);

      const next = util.deepMerge(prefs, patch);
      if (util.deepEqual(next, prefs)) return false;
      const previous = prefs;
      prefs = next;

    /** select(ids, mode). Inside a transaction it updates the transaction's selection (selAfter). */
    function select(ids, mode) {

      else if (m === 'remove') next = base.filter((id) => !list.includes(id));

      get selection() { return selection; },
      get view() { return view; },
      get prefs() { return prefs; },
      get inTransaction() { return !!current; },
      get warnings() { return lastWarnings; },
      node(id) {

      undo, redo, canUndo, canRedo,

      replaceDoc,

      setView,
      setPrefs,
      on: (evt, fn) => emitter.on(evt, fn),
      once: (evt, fn) => emitter.once(evt, fn),
      off: (evt, fn) => emitter.off(evt, fn),
      /** Internal: full history entries (read-only use; tests & history panel). */
      _entries: () => entries

    return store;

  return { create, DEFAULT_PREFS, defaultPrefs, HISTORY_CAP, COALESCE_MS };
});

 * elements — element type registry. See ARCHITECTURE.md §5.4.
 *
 * Definitions are validated and normalized on register(). The core types live in

    fill: true, border: true, radius: true, shadow: true, text: false, padding: false,
    effects: true, stroke: false, image: false, layout: false

      type: def.type,
      label: def.label.trim(),
      icon: typeof def.icon === 'string' && def.icon ? def.icon : def.type,
      category: def.category || 'basic',
      container,
      accepts: typeof def.accepts === 'function' ? def.accepts : null,
      caps: Object.freeze(Object.assign({}, DEFAULT_CAPS, { layout: container }, def.caps || {})),
      bpProps: Object.freeze((def.bpProps || []).slice()),
      textEdit: typeof def.textEdit === 'string' && def.textEdit ? def.textEdit : null,
      inspector: Object.freeze(normalizeInspector(def, def.inspector)),
      audit: typeof def.audit === 'function' ? def.audit : null,
      insertable: def.insertable !== false

  function unregister(type) {
    return defs.delete(type);
  }

  function get(type) {
    if (typeof type !== 'string') return null;
    if (!defs.has(type)) ensureCore();
    return defs.get(type) || null;
  }

  function has(type) {
    return get(type) !== null;
  }

  /** list({ category, insertable }) → defs in registration order. */
  function list(filter) {
    ensureCore();
    const f = filter || {};
    let out = Array.from(defs.values());
    if (f.category) out = out.filter((d) => d.category === f.category);
    if (f.insertable !== undefined) out = out.filter((d) => d.insertable === !!f.insertable);
    return out;
  }

  function types() {
    ensureCore();
    return Array.from(defs.keys());
  }

  /** canContain(parentType, childType) → boolean (container + accepts check). */
  function canContain(parentType, childType) {
    const parent = get(parentType);
    if (!parent || !parent.container) return false;
    if (childType === 'page') return false;
    if (!parent.accepts) return true;
    try { return !!parent.accepts(childType); } catch (_) { return false; }

    } catch (_) { return []; }
  }

<script data-src="js/core/element-types.js">
/* @node-testable */
/*
 * element-types — the 14 core element types, registered into `elements`. See ARCHITECTURE.md §5.4.
 *
 * VNode functions receive the *effective* node (after the breakpoint cascade) and a ctx

  const SECTION_TAGS = ['section', 'header', 'footer', 'nav', 'main', 'aside', 'article', 'div'];

  const SHAPES = ['rect', 'ellipse', 'line', 'triangle', 'star', 'arrow', 'polygon'];

  const LINE_STYLES = ['solid', 'dashed', 'dotted', 'double'];

  const PLACEHOLDER_SVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240">' +
    '<rect width="320" height="240" fill="#e5e7eb"/><circle cx="104" cy="84" r="22" fill="#9ca3af"/>' +

    if (ctx && typeof ctx.cssValue === 'function') return ctx.cssValue;

  /** Link attributes; in the editor the URL is kept as data-href so links never navigate. */

    const href = resolveURL(ctx, p.href, 'link');

    type: 'group', label: 'Group', icon: 'group', category: 'layout', container: true, insertable: false,

    styleOmit: ['fill', 'fillImage', 'borderWidth', 'borderStyle', 'borderColor', 'radius', 'shadow', 'padding'],
    defaults: () => ({ name: 'Group', w: 100, h: 100, layout: { mode: 'free' } }),
    vnode: () => ({ tag: 'div', attrs: {}, slot: true }),

    type: 'text', label: 'Text', icon: 'text', category: 'text',

    bpProps: ['text', 'html'],
    textEdit: 'text',
    defaults: () => ({
      name: 'Text', w: 320, h: 64,
      style: { fontSize: 18, lineHeight: 1.5, color: '#111827' },
      props: { text: 'Text', html: null, tag: 'p', href: '', target: '' }

      title: 'Content', fields: [
        { key: 'props.text', label: 'Text', type: 'textarea' },
        { key: 'props.tag', label: 'HTML tag', type: 'select', options: TEXT_TAGS.map((t) => opt(t, '<' + t + '>')) }
      ].concat(LINK_FIELDS)
    }]
  });

    type: 'button', label: 'Button', icon: 'button', category: 'basic',
    caps: { fill: true, border: true, radius: true, shadow: true, text: true, padding: true, effects: true },
    bpProps: ['text'],
    textEdit: 'text',
    defaults: () => ({
      name: 'Button', w: 160, h: 48,
      style: { fill: '#2563eb', color: '#ffffff', radius: 10, padding: [12, 20, 12, 20], fontSize: 16, fontWeight: 600, lineHeight: 1.2, textAlign: 'center' },
      props: { text: 'Get started', href: '', target: '', kind: 'button' }

    }]

        { key: 'props.src', label: 'Image URL', type: 'url', placeholder: 'https://' },
        { key: 'props.alt', label: 'Alt text', type: 'textarea' },
        { key: 'props.decorative', label: 'Decorative (no alt)', type: 'toggle' },

  defs.push({
    type: 'shape', label: 'Shape', icon: 'shape', category: 'basic',
    caps: { fill: true, border: true, radius: true, shadow: true, effects: true, stroke: true },

      const p = node.props || {};

  });

    type: 'spacer', label: 'Spacer', icon: 'spacer', category: 'layout',
    caps: { fill: false, border: false, radius: false, shadow: false, effects: false },
    styleOmit: ['fill', 'fillImage', 'borderWidth', 'borderStyle', 'borderColor', 'radius', 'shadow', 'padding'],

  });

  defs.push({
    type: 'list', label: 'List', icon: 'list', category: 'text',
    caps: { fill: true, border: true, radius: true, shadow: true, text: true, padding: true, effects: true },
    bpProps: ['items'],
    defaults: () => ({

  defs.push({
    type: 'table', label: 'Table', icon: 'table', category: 'text',
    caps: { fill: true, border: true, radius: true, shadow: true, text: true, padding: true, effects: true },
    bpProps: ['rows', 'caption'],
    defaults: () => ({

    }),
    vnode: (node) => {
      const p = node.props || {};
      const rows = Array.isArray(p.rows) ? p.rows.filter(Array.isArray) : [];
      const cols = rows.reduce((m, r) => Math.max(m, r.length), 0);
      const cells = (row, tag) => {
        const out = [];
        for (let i = 0; i < cols; i++) {
          const cell = { tag, text: str(row[i]) };
          if (tag === 'th') cell.attrs = { scope: 'col' };
          out.push(cell);
        }
        return out;
      };

      const at = util.isPlainObject(eff.attrs) ? eff.attrs : {};
      const classes = [];
      if (typeof a.class === 'string' && a.class) classes.push(a.class);
      if (env.mode === 'editor') classes.push('apb-node');
      if (env.classFor) {
        const c = env.classFor(eff);
        if (typeof c === 'string' && c) classes.push(c);
      }
      if (typeof at.className === 'string' && at.className) {
        const c = sanitize.className(at.className);
        if (c) classes.push(c);
      }
      const cls = util.uniq(classes.join(' ').split(/\s+/).filter(Boolean)).join(' ');
      if (cls) a.class = cls;
      if (typeof at.htmlId === 'string' && at.htmlId) {
        const id = sanitize.id(at.htmlId);
        if (id) a.id = id;
      }
      if (typeof at.ariaLabel === 'string' && at.ariaLabel.trim()) a['aria-label'] = at.ariaLabel.trim();
      if (typeof at.role === 'string' && /^[a-z]+(?: [a-z]+)*$/.test(at.role.trim())) a.role = at.role.trim();
      if (typeof at.title === 'string' && at.title.trim()) a.title = at.title.trim();
      if (env.withIds) a['data-node-id'] = eff.id;
    }
    if ((env.inlineStyles || ro.decorate === false) && decls.size) v.style = style.declsToObject(decls);
  }

  function buildNode(env, node, parentEff, scope, rootOpts) {
    const ro = rootOpts || {};
    const eff = scope.eff(node);
    if (!eff) return null;
    if (eff.hidden && !env.includeHidden) return null;
    if (eff.type === 'instance') {
      const exp = expandScope(env.doc, eff, env.bpId, scope);
      if (exp) return buildNode(env, exp.root, parentEff, exp.scope, rootOpts);
    }
    const def = elements.get(eff.type);
    let v = null;
    if (def && eff.type !== 'instance') {
      try {
        v = def.vnode(eff, makeCtx(env, node, eff, scope));
      } catch (err) {
        if (typeof console !== 'undefined') console.error('[APB] vnode() of element type "' + eff.type + '" threw:', err);
      }
    }
    if (!util.isPlainObject(v)) v = eff.type === 'instance' ? { tag: 'div', attrs: { 'data-component-missing': '' } } : { tag: 'div' };
    v = Object.assign({}, v, { attrs: util.isPlainObject(v.attrs) ? Object.assign({}, v.attrs) : {} });
    const decls = style.nodeDecls(env.doc, eff, env.bpId, {
      mode: env.mode, parentEff, bp: env.bpDef, extra: v.style, assetURL: env.assetURL, effective: true, box: ro.box !== false
    });
    delete v.style;
    const container = def ? def.container : Array.isArray(eff.children);
    if (container && Array.isArray(eff.children)) {
      const kids = [];
      for (const cid of eff.children) {
        const c = scope.get(cid);
        if (!c) continue;
        const cv = buildNode(env, c, eff, scope, null);
        if (cv) kids.push(cv);
      }
      const slot = findSlot(v);
      if (kids.length) {
        slot.children = (Array.isArray(slot.children) ? slot.children : []).concat(kids);
        delete slot.text;
        delete slot.html;
      }
      slot.slot = true;
    }
    decorate(env, v, eff, decls, ro);
    if (env.onNode) env.onNode({ id: eff.id, node: eff, parentEff, vnode: v, decls, virtual: !!scope.virtual, bp: env.bpId });
    return v;
  }

  /**
   * buildTree(doc, rootId, { bp, mode = 'export', classFor, withIds, includeHidden, sanitizeHTML,
   *   assetURL, resolveURL, icon, onNode, inlineStyles, parentEff }) → VNode | null
   */
  function buildTree(doc, rootId, opts) {
    const o = opts || {};
    const root = schema.getNode(doc, rootId);
    if (!root) return null;
    const env = makeEnv(doc, o);
    let parentEff = o.parentEff;
    if (parentEff === undefined) parentEff = root.parent ? schema.effectiveNode(doc, root.parent, env.bpId) : null;
    return buildNode(env, root, parentEff, docScope(env), null);
  }

  /**
   * instanceVNode(doc, instanceNode, ctx) → VNode of the expanded master (root undecorated, root
   * `style` = its non-box declarations) or null when the component is missing/cyclic.
   */
  function instanceVNode(doc, node, ctx) {
    const c = ctx || {};
    if (!node) return null;
    const env = makeEnv(doc, {
      mode: c.mode, bp: c.bp, withIds: c.withIds, includeHidden: c.includeHidden, classFor: c.classFor,
      sanitizeHTML: c.sanitizeHTML, assetURL: c.assetURL, resolveURL: c.resolveURL, icon: c.icon
    });
    const inst = c.effective && c.effective.id === node.id ? c.effective : node;
    const exp = expandScope(doc, inst, env.bpId, null);
    if (!exp) return null;
    return buildNode(env, exp.root, null, exp.scope, { box: false, decorate: false });
  }

  /** expandInstance(doc, instance|id, { bp }) → { root, component, nodes: { [id]: effectiveNode } } | null */
  function expandInstance(doc, instOrId, opts) {
    const node = schema.getNode(doc, instOrId);
    if (!node || node.type !== 'instance') return null;
    const bp = style.breakpoint(doc, opts && opts.bp);
    const bpId = bp ? bp.id : undefined;
    const inst = schema.effectiveNode(doc, node, bpId);
    const exp = expandScope(doc, inst, bpId, null);
    if (!exp) return null;
    const nodes = {};
    for (const [id, e] of exp.entries) nodes[id] = exp.scope.eff(e.node);
    return { root: inst.id, component: inst.props.component, nodes };
  }

  return { toHTML, toDOM, patch, buildTree, instanceVNode, expandInstance, collectAttrs, styleString, tagName, VOID };
});
</script>
<script data-src="js/core/snapping.js">
/* @node-testable */
/*
 * snapping — pure snap engine for moving and resizing rects (ARCHITECTURE.md §6.10).
 *
 * All rects are axis-aligned { x, y, w, h } in one coordinate space (the caller passes rotated
 * nodes as their AABB). `threshold` is in the same units (document px; the caller divides screen
 * px by the zoom). Candidates per axis are sorted once and queried by binary search, so a move
 * against n siblings costs O(n log n).
 *
 * Guides: { axis, pos, from, to, kind } — axis 'x' is a vertical line at x = pos spanning
 * y ∈ [from, to]; axis 'y' is a horizontal line at y = pos spanning x ∈ [from, to].
 * Spacing: { axis, a, b, gap, from, to, pos } — axis 'x' is a horizontal gap between rect a (left)
 * and rect b (right) from x = from to x = to, drawn at y = pos (and vice versa for 'y').
 */
APB.define('snapping', [], function () {
  'use strict';

  const EPS = 0.01;          // coincidence tolerance for guides after snapping
  const GAP_EPS = 0.5;       // tolerance when listing existing equal gaps
  const PRIORITY = { edge: 0, center: 0, parent: 1, spacing: 2, grid: 3 };
  const AXES = {
    x: { p: 'x', s: 'w', q: 'y', t: 'h' },
    y: { p: 'y', s: 'h', q: 'x', t: 'w' }
  };

  const isNum = (v) => typeof v === 'number' && Number.isFinite(v);
  const num = (v, d) => (isNum(v) ? v : d);

  function validRect(r) {
    return !!r && isNum(r.x) && isNum(r.y) && isNum(r.w) && isNum(r.h);
  }

  function normRect(r) {
    let { x, y, w, h } = r;
    if (w < 0) { x += w; w = -w; }
    if (h < 0) { y += h; h = -h; }
    return { x, y, w, h };
  }

  function normalizeOthers(list) {
    const others = [];
    if (Array.isArray(list)) for (const r of list) if (validRect(r)) others.push(normRect(r));
    return others;
  }

  function readOptions(o) {
    const idx = o.index && o.index.__snapIndex ? o.index : null;
    const others = idx ? idx.others : normalizeOthers(o.others);
    const gridSize = o.grid && num(o.gridSize, 0) > 0 ? o.gridSize : 0;
    const go = o.gridOrigin && typeof o.gridOrigin === 'object' ? o.gridOrigin : {};
    return {
      threshold: Math.max(0, num(o.threshold, 6)),
      objects: o.objects !== false,
      others,
      index: idx,
      parent: idx ? idx.parent : (validRect(o.parent) ? normRect(o.parent) : null),
      gridSize,
      gridOrigin: { x: num(go.x, 0), y: num(go.y, 0) }
    };
  }

  /* ------------------------------------------------------------ candidates */

  /** Sorted snap lines for one axis: sibling edges/centers and parent edges/center. */
  function buildCandidates(axis, cfg) {
    if (!cfg.objects) return [];
    if (cfg.index) return cfg.index[axis];
    return sortedCandidates(axis, cfg.others, cfg.parent);
  }

  function sortedCandidates(axis, others, parent) {
    const A = AXES[axis];
    const list = [];
    for (const r of others) {
      list.push({ v: r[A.p], kind: 'edge', rect: r });
      list.push({ v: r[A.p] + r[A.s] / 2, kind: 'center', rect: r });
      list.push({ v: r[A.p] + r[A.s], kind: 'edge', rect: r });
    }
    const pr = parent;
    if (pr) {
      list.push({ v: pr[A.p], kind: 'parent', rect: pr });
      list.push({ v: pr[A.p] + pr[A.s] / 2, kind: 'parent', rect: pr });
      list.push({ v: pr[A.p] + pr[A.s], kind: 'parent', rect: pr });
    }
    list.sort((a, b) => a.v - b.v);
    return list;
  }

  /** First index whose value is >= v. */
  function lowerBound(list, v, key) {
    let lo = 0;
    let hi = list.length;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      const mv = key ? list[mid][key] : list[mid];
      if (mv < v) lo = mid + 1; else hi = mid;
    }
    return lo;
  }

  /** Nearest candidate to value within thr → { d, ad, kind } | null. */
  function nearest(list, value, thr) {
    let best = null;
    for (let i = lowerBound(list, value - thr, 'v'); i < list.length && list[i].v <= value + thr; i++) {
      const c = list[i];
      const d = c.v - value;
      const ad = Math.abs(d);
      if (!best || ad < best.ad - 1e-9 || (Math.abs(ad - best.ad) <= 1e-9 && PRIORITY[c.kind] < PRIORITY[best.kind])) {
        best = { d, ad, kind: c.kind };
      }
    }
    return best;
  }

  function matchesAt(list, value, eps) {
    const out = [];
    for (let i = lowerBound(list, value - eps, 'v'); i < list.length && list[i].v <= value + eps; i++) out.push(list[i]);
    return out;
  }

  function gridLine(v, size, origin) {
    return origin + Math.round((v - origin) / size) * size;
  }

  function better(cand, best) {
    if (!best) return true;
    if (cand.ad < best.ad - 1e-9) return true;
    return Math.abs(cand.ad - best.ad) <= 1e-9 && PRIORITY[cand.kind] < PRIORITY[best.kind];
  }

  /* -------------------------------------------------------- equal spacing */

  /** Others overlapping `rect` on the cross axis (the "row" for axis x, the "column" for axis y). */
  function lineNeighbours(axis, rect, others) {
    const A = AXES[axis];
    const lo = rect[A.q];
    const hi = rect[A.q] + rect[A.t];
    const out = [];
    for (const r of others) if (r[A.q] < hi && r[A.q] + r[A.t] > lo) out.push(r);
    return out;
  }

  /** Gaps between consecutive non-overlapping neighbours, sorted by start. */
  function gapPairs(axis, row) {
    const A = AXES[axis];
    const sorted = row.slice().sort((a, b) => a[A.p] - b[A.p]);
    const pairs = [];
    let prev = null;
    for (const r of sorted) {
      if (prev) {
        const gap = r[A.p] - (prev[A.p] + prev[A.s]);
        if (gap > EPS) pairs.push({ a: prev, b: r, gap });
      }
      if (!prev || r[A.p] + r[A.s] > prev[A.p] + prev[A.s]) prev = r;
    }
    return pairs;
  }

  function nearestNeighbours(axis, rect, row, tol) {
    const A = AXES[axis];
    const start = rect[A.p];
    const end = start + rect[A.s];
    let L = null;
    let R = null;
    for (const r of row) {
      const rs = r[A.p];
      const re = rs + r[A.s];
      if (re <= start + tol && rs < start && (!L || re > L[A.p] + L[A.s])) L = r;
      if (rs >= end - tol && re > end && (!R || rs < R[A.p])) R = r;
    }
    return { L, R };
  }

  /**
   * Equal-spacing snap along one axis → { d, ad, kind: 'spacing', gap } | null.
   * Cases: centre the rect between its nearest neighbours, or continue an existing gap after the
   * left neighbour / before the right neighbour.
   */
  function spacingSnap(axis, rect, others, thr) {
    const A = AXES[axis];
    const row = lineNeighbours(axis, rect, others);
    if (!row.length) return null;
    const start = rect[A.p];
    const size = rect[A.s];
    const end = start + size;
    const { L, R } = nearestNeighbours(axis, rect, row, thr);
    const lEnd = L ? L[A.p] + L[A.s] : -Infinity;
    const rStart = R ? R[A.p] : Infinity;
    let best = null;
    const consider = (d, gap) => {
      const c = { d, ad: Math.abs(d), kind: 'spacing', gap };
      if (c.ad <= thr && gap > EPS && (!best || c.ad < best.ad - 1e-9)) best = c;
    };
    if (L && R) {
      const gap = (rStart - lEnd - size) / 2;
      consider(lEnd + gap - start, gap);
    }
    if (L || R) {
      // Existing gaps whose interval does not contain the moving rect.
      const gaps = gapPairs(axis, row)
        .filter((p) => !(p.a[A.p] + p.a[A.s] < end && p.b[A.p] > start))
        .map((p) => p.gap)
        .sort((a, b) => a - b);
      if (gaps.length) {
        if (L) {
          const want = start - lEnd; // gap that would leave the rect where it is
          for (let i = lowerBound(gaps, want - thr); i < gaps.length && gaps[i] <= want + thr; i++) {
            const g = gaps[i];
            if (lEnd + g + size <= rStart + EPS) consider(lEnd + g - start, g);
          }
        }
        if (R) {
          const want = rStart - end;
          for (let i = lowerBound(gaps, want - thr); i < gaps.length && gaps[i] <= want + thr; i++) {
            const g = gaps[i];
            if (rStart - g - size >= lEnd - EPS) consider(rStart - g - size - start, g);
          }
        }
      }
    }
    return best;
  }

  function spacingSegment(axis, a, b, gap) {
    const A = AXES[axis];
    const lo = Math.max(a[A.q], b[A.q]);
    const hi = Math.min(a[A.q] + a[A.t], b[A.q] + b[A.t]);
    const pos = hi >= lo ? (lo + hi) / 2 : (Math.min(a[A.q], b[A.q]) + Math.max(a[A.q] + a[A.t], b[A.q] + b[A.t])) / 2;
    return { axis, a, b, gap, from: a[A.p] + a[A.s], to: b[A.p], pos };
  }

  /** Spacing segments equal to `gap` around the (snapped) rect and among its neighbours. */
  function spacingSegments(axis, rect, others, gap) {
    const A = AXES[axis];
    const row = lineNeighbours(axis, rect, others);
    const out = [];
    const { L, R } = nearestNeighbours(axis, rect, row, EPS);
    if (L && Math.abs(rect[A.p] - (L[A.p] + L[A.s]) - gap) <= GAP_EPS) out.push(spacingSegment(axis, L, rect, gap));
    if (R && Math.abs(R[A.p] - (rect[A.p] + rect[A.s]) - gap) <= GAP_EPS) out.push(spacingSegment(axis, rect, R, gap));
    for (const p of gapPairs(axis, row)) {
      if (Math.abs(p.gap - gap) > GAP_EPS) continue;
      if (p.a[A.p] + p.a[A.s] < rect[A.p] + rect[A.s] && p.b[A.p] > rect[A.p]) continue; // spans the rect
      out.push(spacingSegment(axis, p.a, p.b, p.gap));
    }
    return out;
  }

  /* ----------------------------------------------------------------- guides */

  function crossExtent(axis, rects) {
    const A = AXES[axis];
    let from = Infinity;
    let to = -Infinity;
    for (const r of rects) {
      if (r[A.q] < from) from = r[A.q];
      if (r[A.q] + r[A.t] > to) to = r[A.q] + r[A.t];
    }
    return { from, to };
  }

  /**
   * Guides for the given positions of the snapped rect on one axis: every candidate line that
   * coincides with a position, merged per (pos, kind).
   */
  function collectGuides(axis, rect, positions, cands, extra) {
    const map = new Map();
    for (const pos of positions) {
      for (const c of matchesAt(cands, pos, EPS)) {
        const key = c.kind + ':' + Math.round(c.v * 100);
        let g = map.get(key);
        if (!g) { g = { axis, pos: c.v, kind: c.kind, rects: [rect] }; map.set(key, g); }
        g.rects.push(c.rect);
      }
    }
    const out = [];
    for (const g of map.values()) {
      const ext = crossExtent(axis, g.rects);
      out.push({ axis, pos: g.pos, from: ext.from, to: ext.to, kind: g.kind });
    }
    if (extra) out.push(extra);
    out.sort((a, b) => a.pos - b.pos || (a.kind < b.kind ? -1 : a.kind > b.kind ? 1 : 0));
    return out;
  }

  function gridGuide(axis, rect, pos, parent) {
    const ext = crossExtent(axis, parent ? [rect, parent] : [rect]);
    return { axis, pos, from: ext.from, to: ext.to, kind: 'grid' };
  }

  /* ------------------------------------------------------------------- move */

  /**
   * snapMove({ rect, others, parent, grid, gridSize, gridOrigin, threshold, objects })
   *   → { dx, dy, guides, spacing, snapped: { x: kind|null, y: kind|null } }
   * Snaps left/center/right (top/middle/bottom) of rect to sibling lines, parent edges/center,
   * equal gaps between siblings and the grid; the closest candidate per axis wins (ties prefer
   * object alignment over parent, spacing and grid).
   */
  function snapMove(opts) {
    const o = opts || {};
    const result = { dx: 0, dy: 0, guides: [], spacing: [], snapped: { x: null, y: null } };
    if (!validRect(o.rect)) return result;
    const rect = normRect(o.rect);
    const cfg = readOptions(o);
    const thr = cfg.threshold;
    if (!(thr > 0)) return result;

    const perAxis = {};
    for (const axis of ['x', 'y']) {
      const A = AXES[axis];
      const cands = buildCandidates(axis, cfg);
      const start = rect[A.p];
      const size = rect[A.s];
      const anchors = size > 0 ? [start, start + size / 2, start + size] : [start];
      let best = null;
      for (const a of anchors) {
        const n = nearest(cands, a, thr);
        if (n && better(n, best)) best = n;
      }
      let gridPos = null;
      if (cfg.gridSize) {
        for (const a of size > 0 ? [start, start + size] : [start]) {
          const line = gridLine(a, cfg.gridSize, cfg.gridOrigin[axis]);
          const c = { d: line - a, ad: Math.abs(line - a), kind: 'grid' };
          if (c.ad <= thr && better(c, best)) { best = c; gridPos = line; }
        }
      }
      let spacing = null;
      if (cfg.objects && size > 0) {
        spacing = spacingSnap(axis, rect, cfg.others, thr);
        if (spacing && better(spacing, best)) { best = spacing; gridPos = null; }
      }
      if (best && best.kind !== 'grid') gridPos = null;
      perAxis[axis] = { cands, best, spacing, gridPos };
      if (best) {
        result['d' + axis] = best.d;
        result.snapped[axis] = best.kind;
      }
    }

    const moved = { x: rect.x + result.dx, y: rect.y + result.dy, w: rect.w, h: rect.h };
    for (const axis of ['x', 'y']) {
      const info = perAxis[axis];
      if (!info.best) continue;
      const A = AXES[axis];
      const start = moved[A.p];
      const positions = moved[A.s] > 0 ? [start, start + moved[A.s] / 2, start + moved[A.s]] : [start];
      const extra = info.gridPos !== null ? gridGuide(axis, moved, info.gridPos, cfg.parent) : null;
      result.guides.push.apply(result.guides, collectGuides(axis, moved, positions, info.cands, extra));
      if (info.spacing && Math.abs(info.spacing.d - info.best.d) <= EPS) {
        result.spacing.push.apply(result.spacing, spacingSegments(axis, moved, cfg.others, info.spacing.gap));
      }
    }
    return result;
  }

  /** snapPoint({ point, others, parent, grid, gridSize, threshold }) → { x, y, guides } (drawing tools). */
  function snapPoint(opts) {
    const o = opts || {};
    const p = o.point || {};
    if (!isNum(p.x) || !isNum(p.y)) return { x: p.x, y: p.y, guides: [] };
    const r = snapMove(Object.assign({}, o, { rect: { x: p.x, y: p.y, w: 0, h: 0 } }));
    return { x: p.x + r.dx, y: p.y + r.dy, guides: r.guides };
  }

  /* ----------------------------------------------------------------- resize */

  /**
   * snapResize({ rect, handle, others, parent, grid, gridSize, gridOrigin, threshold, objects,
   *              keepAspect, fromCenter, minW = 1, minH = 1 }) → { rect, guides, snapped }
   * `rect` is the proposed (already resized) rect; the edges moved by `handle` (n s e w ne nw se sw)
   * snap to sibling/parent lines and the grid. With keepAspect only the closer axis snaps and the
   * other dimension follows the aspect ratio (anchored like geometry.resize).
   */
  function snapResize(opts) {
    const o = opts || {};
    if (!validRect(o.rect)) return { rect: o.rect ? Object.assign({}, o.rect) : null, guides: [], snapped: { x: null, y: null } };
    const rect = normRect(o.rect);
    const cfg = readOptions(o);
    const thr = cfg.threshold;
    const handle = String(o.handle || '');
    const fromCenter = !!o.fromCenter;
    const mins = { x: Math.max(0, num(o.minW, 1)), y: Math.max(0, num(o.minH, 1)) };
    const moving = {
      x: handle.includes('e') ? 'end' : handle.includes('w') ? 'start' : null,
      y: handle.includes('s') ? 'end' : handle.includes('n') ? 'start' : null
    };
    const out = { rect: Object.assign({}, rect), guides: [], snapped: { x: null, y: null } };
    if (!(thr > 0) || (!moving.x && !moving.y)) return out;

    const found = {};
    for (const axis of ['x', 'y']) {
      if (!moving[axis]) continue;
      const A = AXES[axis];
      const cands = buildCandidates(axis, cfg);
      const edge = moving[axis] === 'end' ? rect[A.p] + rect[A.s] : rect[A.p];
      let best = nearest(cands, edge, thr);
      let gridPos = null;
      if (cfg.gridSize) {
        const line = gridLine(edge, cfg.gridSize, cfg.gridOrigin[axis]);
        const c = { d: line - edge, ad: Math.abs(line - edge), kind: 'grid' };
        if (c.ad <= thr && better(c, best)) { best = c; gridPos = line; }
      }
      if (best) {
        // Reject snaps that would violate the minimum size.
        const k = fromCenter ? 2 : 1;
        const newSize = moving[axis] === 'end' ? rect[A.s] + best.d * k : rect[A.s] - best.d * k;
        if (newSize < mins[axis]) best = null;
      }
      if (best) found[axis] = { best, cands, gridPos: best.kind === 'grid' ? gridPos : null };
    }

    const apply = (r, axis, d) => {
      const A = AXES[axis];
      const k = fromCenter ? 2 : 1;
      if (moving[axis] === 'end') {
        r[A.s] = rect[A.s] + d * k;

/* @node-testable */
/*
 * docops — high-level document operations (ARCHITECTURE.md §6.11). Every public operation is ONE
 * labelled store transaction (so one undo step) and accepts the `app` or a `store` as first arg.
 *
 * Coordinates: a node's x/y are relative to its parent's (unrotated) local frame; rotation turns a
 * node around its own center. World (page) placement is computed by composing ancestor frames.
 * Children of stack parents are placed by an approximate flow layout (or by the canvas renderer's
 * worldRect when the first argument is an app with a mounted canvas and the doc is unchanged).
 *
 * Breakpoints: geometric/visibility writes (move, setBox, update, align, distribute, tidy, radial,
 * matchSize, setHidden, fitGroup) default to `store.view.bp` (so edits on a non-base breakpoint
 * become overrides); pass { bp } to force one. Structural ops (insert, remove, duplicate, reparent,
 * group, ungroup, wrap, components) work on base values.
 */
APB.define('docops', ['util', 'geometry', 'schema'], function (util, geometry, schema) {
  'use strict';

  const BOX_KEYS = ['x', 'y', 'w', 'h', 'rotation'];
  const PATCH_BLOCKED = new Set(['id', 'parent', 'children', 'type']);
  const TEXTY = new Set(['text', 'list', 'html', 'table']);
  const ALIGN_LABELS = {
    left: 'Align left', hcenter: 'Align horizontal centers', right: 'Align right',
    top: 'Align top', vcenter: 'Align vertical centers', bottom: 'Align bottom'
  };
  const ZORDER_LABELS = { forward: 'Bring forward', backward: 'Send backward', front: 'Bring to front', back: 'Send to back' };

  const isNum = (v) => typeof v === 'number' && Number.isFinite(v);
  const num = (v, d) => (isNum(v) ? v : d);
  const has = (obj, k) => !!obj && Object.prototype.hasOwnProperty.call(obj, k);

  function rnd(v) {
    const r = Math.round(v * 1000) / 1000;
    return Object.is(r, -0) ? 0 : r;
  }

  function near(a, b, eps) {
    return Math.abs(a - b) <= (eps === undefined ? 1e-6 : eps);
  }

  function rotV(v, deg) {
    return geometry.rotateVector(v, deg || 0);
  }

  function normAngle(deg) {
    return rnd(geometry.normalizeAngle(deg || 0));
  }

  /* ---------------------------------------------------------------- basics */

  function resolve(target) {
    if (target && typeof target.transact === 'function') return { store: target, app: null };
    if (target && target.store && typeof target.store.transact === 'function') return { store: target.store, app: target };
    throw new TypeError('docops: first argument must be the app or a store');
  }

  function baseBpId(doc) {
    const bps = doc.settings && doc.settings.breakpoints;
    return bps && bps.length ? bps[0].id : null;
  }

  /** Breakpoint for geometric writes: explicit opts.bp, else the active view breakpoint. */
  function bpFor(store, opts) {
    if (opts && opts.bp !== undefined) return opts.bp || null;
    return (store.view && store.view.bp) || null;
  }

  function toArray(ids) {
    if (ids === undefined || ids === null) return [];
    return Array.isArray(ids) ? ids : [ids];
  }

  function nodeOf(doc, id) {
    return typeof id === 'string' && has(doc.nodes, id) ? doc.nodes[id] : null;
  }

  function isRoot(doc, id) {
    const n = nodeOf(doc, id);
    return !!n && !n.parent;
  }

  function existing(doc, ids) {
    const seen = new Set();
    const out = [];
    for (const id of toArray(ids)) {
      if (seen.has(id) || !nodeOf(doc, id)) continue;
      seen.add(id);
      out.push(id);
    }
    return out;
  }

  /** Existing, non-root ids whose ancestors are not also in the list. */
  function topLevel(doc, ids) {
    const list = existing(doc, ids).filter((id) => !isRoot(doc, id));
    const set = new Set(list);
    return list.filter((id) => !schema.ancestors(doc, id).some((a) => set.has(a)));
  }

  function orderKey(doc, id) {
    const key = [];
    let n = nodeOf(doc, id);
    const seen = new Set();
    while (n && n.parent && !seen.has(n.id)) {
      seen.add(n.id);
      const p = nodeOf(doc, n.parent);
      key.unshift(p && Array.isArray(p.children) ? p.children.indexOf(n.id) : 0);
      n = p;

  function currentPage(doc, store) {

  /** Default insertion parent: sections go into the page root; others into the view context or first section. */
  function defaultParent(doc, store, type) {
    const page = currentPage(doc, store);
    const root = page ? page.root : null;
    if (type === 'section') return root;
    const view = store.view || {};
    const ctxNode = nodeOf(doc, view.context);
    if (ctxNode && isContainerNode(ctxNode)) return ctxNode.id;

    }
    return root;
  }

  /* -------------------------------------------------------------- geometry */

  function domHook(c, doc, bp) {
    const app = c.app;
    const renderer = app && app.canvas && app.canvas.renderer;
    if (!renderer || typeof renderer.worldRect !== 'function') return null;
    if (doc !== c.store.doc) return null;
    const viewBp = (c.store.view && c.store.view.bp) || baseBpId(doc);
    if ((bp || baseBpId(doc)) !== viewBp) return null;
    return (id) => {

      } catch (_) {
        return null;
      }
    };
  }

  /**
   * Geometry view of a doc snapshot at a breakpoint (memoized; create a new one after structural
   * changes). World boxes are { cx, cy, w, h, rotation }; frames are { x, y, rot } (origin of a
   * container's local coordinate system in world space).
   */
  function makeGeo(doc, bp, dom) {
    const local = new Map();
    const frames = new Map();
    const eff = (id) => schema.effectiveNode(doc, id, bp);

    function bpWidth() {
      const bps = (doc.settings && doc.settings.breakpoints) || [];
      const b = bps.find((x) => x.id === bp) || bps[0];
      return b ? b.width : 1440;
    }

    function stackPlacement(p, id) {
      const L = p.layout;
      const pad = schema.normalizePad(L.pad);
      const row = L.dir === 'row';
      const pbox = localBox(p.id);
      const innerMain = Math.max(0, row ? pbox.w - pad[1] - pad[3] : pbox.h - pad[0] - pad[2]);
      const innerCross = Math.max(0, row ? pbox.h - pad[0] - pad[2] : pbox.w - pad[1] - pad[3]);
      const kids = (p.children || []).map(eff).filter((k) => k && !k.hidden);
      const gap = num(L.gap, 0);
      const psz = p.sizing || {};
      const hugMain = (row ? psz.w : psz.h) === 'hug';
      const items = kids.map((k) => {
        const sz = k.sizing || {};
        const mainMode = row ? sz.w : sz.h;
        const crossMode = row ? sz.h : sz.w;
        let main = num(row ? k.w : k.h, 0);
        let cross = num(row ? k.h : k.w, 0);

        if (crossMode === 'fill' || (L.align === 'stretch' && crossMode === 'hug')) cross = innerCross;
        return { id: k.id, main, cross, fill: mainMode === 'fill' && !hugMain };
      });
      const fills = items.filter((it) => it.fill);
      const fixedTotal = items.filter((it) => !it.fill).reduce((s, it) => s + it.main, 0) + gap * Math.max(0, items.length - 1);
      if (fills.length) {
        const each = Math.max(0, (innerMain - fixedTotal) / fills.length);
        fills.forEach((it) => { it.main = each; });
      }
      const total = items.reduce((s, it) => s + it.main, 0) + gap * Math.max(0, items.length - 1);

      let spacing = gap;

        else if (L.justify === 'end') offset = free;
        else if (L.justify === 'between' && items.length > 1) spacing = gap + free / (items.length - 1);

        const p = n.parent ? eff(n.parent) : null;
        const w = n.type === 'page' ? bpWidth() : num(n.w, 0);
        box = { x: num(n.x, 0), y: num(n.y, 0), w, h: num(n.h, 0), rotation: num(n.rotation, 0) };
        if (!p) {

      const wb = world(id);

  /* ------------------------------------------------------- tx-level helpers */

  function shiftBpOverrides(tx, id, dx, dy) {

  function clearStyle(tx, id) {

  function fitGroupTx(tx, gid, bp) {
    const d = tx.doc;
    const g = schema.effectiveNode(d, gid, bp);
    if (!g || !Array.isArray(g.children) || !g.children.length) return false;
    const kids = g.children.map((id) => schema.effectiveNode(d, id, bp)).filter(Boolean);
    if (!kids.length) return false;
    const B = geometry.aabb(kids.map((k) => geometry.aabb(geometry.corners({ x: k.x, y: k.y, w: k.w, h: k.h }, k.rotation || 0))));
    const bx = rnd(B.x);
    const by = rnd(B.y);
    const bw = rnd(B.w);
    const bh = rnd(B.h);
    if (near(bx, 0, 1e-3) && near(by, 0, 1e-3) && near(bw, g.w, 1e-3) && near(bh, g.h, 1e-3)) return false;
    const rot = g.rotation || 0;
    const v = rotV({ x: B.x + B.w / 2 - g.w / 2, y: B.y + B.h / 2 - g.h / 2 }, rot);
    const nc = { x: g.x + g.w / 2 + v.x, y: g.y + g.h / 2 + v.y };
    tx.updateNode(gid, { x: rnd(nc.x - B.w / 2), y: rnd(nc.y - B.h / 2), w: bw, h: bh }, { bp });
    if (!near(B.x, 0, 1e-9) || !near(B.y, 0, 1e-9)) {
      for (const k of kids) tx.updateNode(k.id, { x: rnd(k.x - B.x), y: rnd(k.y - B.y) }, { bp });

  }

  function depthOf(doc, id) {
    return schema.ancestors(doc, id).length;
  }

  /** Refit every group ancestor of ids (deepest first). */
  function refitGroups(tx, ids, bp) {
    const d = tx.doc;
    const groups = new Set();
    for (const id of toArray(ids)) {
      let n = nodeOf(d, id);
      while (n && n.parent) {
        const p = nodeOf(d, n.parent);
        if (!p || p.type !== 'group') break;
        groups.add(p.id);
        n = p;
      }
    }
    const list = Array.from(groups).sort((a, b) => depthOf(d, b) - depthOf(d, a));
    for (const gid of list) if (nodeOf(tx.doc, gid)) fitGroupTx(tx, gid, bp);
  }

  function cleanupContainers(tx, parents) {

      let id = pid;
      while (id) {
        const n = tx.node(id);
        if (!n || n.type !== 'group') break;
        if (n.children && n.children.length) { toFit.push(id); break; }
        const up = n.parent;
        tx.removeNode(id);
        id = up;
      }
    }
    const d = tx.doc;
    toFit.filter((id) => nodeOf(d, id)).sort((a, b) => depthOf(d, b) - depthOf(d, a)).forEach((id) => {
      fitGroupTx(tx, id, null);
      refitGroups(tx, [id], null);
    });
